<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{min-height:100vh;background:#0a2810;display:flex;flex-direction:column;align-items:center;padding-top:80px}
.top{display:flex;gap:12px;margin-bottom:25px}
.top button{background:#ffffff22;border:1px solid #ffffff44;color:#fff;padding:12px 26px;border-radius:30px;font-size:14px;cursor:pointer}
.card{background:#ffffff26;border:1px solid #ffffff33;backdrop-filter:blur(12px);border-radius:32px;padding:18px 12px;width:92%;max-width:620px;overflow:hidden}
.title{color:#ffffffcc;text-align:center;letter-spacing:5px;font-size:11px;margin-bottom:14px;font-weight:600}
.row{display:flex;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.col{flex:1;min-width:58px;text-align:center;border-right:1px solid #ffffff26;padding:0 4px}
.col:last-child{border:none;min-width:75px}
.col i{font-style:normal;color:#ffffff99;font-size:8px;letter-spacing:1.5px;display:block}
.col b{color:#fff;font-size:clamp(12px, 3.6vw, 17px);display:block;margin-top:6px;white-space:nowrap}
.dob-pill{margin-top:25px;background:#ffffff22;border:1px solid #ffffff33;border-radius:40px;display:flex;align-items:center;padding:6px 6px 6px 18px;gap:12px}
.dob-pill span{color:#fff;font-size:14px;flex:1}
.dob-pill button{background:#fff;color:#000;border:none;padding:10px 18px;border-radius:30px;font-weight:700;font-size:13px;cursor:pointer}
input[type=date]{position:absolute;opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="top">
  <button onclick="setSize('small')">Chota</button>
  <button onclick="setSize('medium')">Medium</button>
  <button onclick="setSize('big')">Bada</button>
</div>

<div class="card">
  <div class="title">AGE TIMER</div>
  <div class="row">
    <div class="col"><i>YEAR</i><b id="y">19</b></div>
    <div class="col"><i>MONTH</i><b id="mo">234</b></div>
    <div class="col"><i>DAYS</i><b id="d">7123</b></div>
    <div class="col"><i>HOURS</i><b id="h">170965</b></div>
    <div class="col"><i>MINTS</i><b id="mi">10257935</b></div>
    <div class="col"><i>SECS</i><b id="s">615476116</b></div>
  </div>
</div>

<div class="dob-pill">
  <span id="dobText">23 Apr 2007</span>
  <button id="setDobBtn">Set DOB</button>
</div>

<input type="date" id="dobInput">

<script>
const dobInput = document.getElementById('dobInput');
const dobText = document.getElementById('dobText');
const setBtn = document.getElementById('setDobBtn');
let timer;

function formatDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

function startLive(dobStr){
  clearInterval(timer);
  localStorage.setItem('green_dob', dobStr);
  dobText.innerText = formatDate(dobStr);
  timer = setInterval(()=>{
    const birth = new Date(dobStr);
    const now = new Date();
    const diff = now - birth;
    const years = Math.floor(diff / (1000*60*60*24*365.25));
    const months = Math.floor(diff / (1000*60*60*24*30.44));
    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor(diff / (1000*60*60));
    const mints = Math.floor(diff / (1000*60));
    const secs = Math.floor(diff / 1000);
    document.getElementById('y').innerText = years;
    document.getElementById('mo').innerText = months;
    document.getElementById('d').innerText = days;
    document.getElementById('h').innerText = hours.toLocaleString('en-IN');
    document.getElementById('mi').innerText = mints.toLocaleString('en-IN');
    document.getElementById('s').innerText = secs.toLocaleString('en-IN');
  },1000);
}

// DOB CHANGE FIX
setBtn.addEventListener('click', ()=>{
  dobInput.showPicker ? dobInput.showPicker() : dobInput.click();
});
dobInput.addEventListener('change', (e)=>{
  if(e.target.value) startLive(e.target.value);
});

function setSize(s){
  document.querySelector('.card').style.transform = s==='small'?'scale(0.85)':s==='big'?'scale(1.1)':'scale(1)';
}

// load
const saved = localStorage.getItem('green_dob') || '2007-04-23';
dobInput.value = saved;
startLive(saved);
</script>
</body>
</html>

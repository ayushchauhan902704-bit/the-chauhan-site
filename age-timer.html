<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Timer - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:radial-gradient(circle at 50% 0%, #2f5e38 0%, #162e1a 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.controls{ display:flex; gap:10px; margin-bottom:24px; }
.controls button{
  padding:8px 20px; border-radius:20px;
  border:1px solid rgba(255,255,255,0.25);
  background:rgba(255,255,255,0.12);
  color:white; backdrop-filter:blur(10px); cursor:pointer;
}
.pill{
  width:100%; max-width:920px;
  background:linear-gradient(180deg, rgba(205,228,208,0.38), rgba(135,178,140,0.30));
  backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px);
  border-radius:100px;
  padding:24px 14px 30px;
  border:1.5px solid rgba(255,255,255,0.32);
  box-shadow:0 25px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
  transition:transform 0.3s;
}
.head{ text-align:center; color:rgba(255,255,255,0.85); font-size:11px; letter-spacing:4px; font-weight:600; margin-bottom:22px; }
.row{ display:flex; justify-content:space-between; }
.col{ flex:1; text-align:center; padding:0 6px; border-right:1px solid rgba(255,255,255,0.14); }
.col:last-child{ border:none; }
.col span{ display:block; font-size:10px; color:rgba(255,255,255,0.65); letter-spacing:1.2px; font-weight:700; }
.col b{ display:block; margin-top:14px; color:white; font-weight:800; line-height:1; letter-spacing:-0.5px; white-space:nowrap; }
.col:nth-child(1) b, .col:nth-child(2) b, .col:nth-child(3) b{ font-size:clamp(22px, 3.2vw, 42px); }
.col:nth-child(4) b{ font-size:clamp(18px, 2.6vw, 34px); }
.col:nth-child(5) b{ font-size:clamp(16px, 2.2vw, 30px); }
.col:nth-child(6) b{ font-size:clamp(14px, 1.9vw, 26px); }

.small{ transform:scale(0.82); } .medium{ transform:scale(1); } .large{ transform:scale(1.1); }
.dob{ margin-top:24px; display:flex; gap:10px; align-items:center; background:rgba(255,255,255,0.13); padding:8px 12px; border-radius:24px; border:1px solid rgba(255,255,255,0.18); }
.dob input{ background:transparent; border:none; color:white; outline:none; color-scheme:dark; }
.dob button{ border:none; background:white; color:#1d3a22; padding:8px 16px; border-radius:16px; font-weight:800; cursor:pointer; }

@media(max-width:650px){
  .pill{ border-radius:32px; padding:20px 8px; }
  .col span{ font-size:7.5px; }
  .head{ margin-bottom:14px; font-size:9px; }
}
</style>
</head>
<body>

<div class="controls">
  <button onclick="setSize('small')">Chota</button>
  <button onclick="setSize('medium')">Medium</button>
  <button onclick="setSize('large')">Bada</button>
</div>

<div id="mainPill" class="pill medium">
  <div class="head">AGE TIMER</div>
  <div class="row">
    <div class="col"><span>YEAR</span><b id="y">19</b></div>
    <div class="col"><span>MONTH</span><b id="mo">228</b></div>
    <div class="col"><span>DAYS</span><b id="d">7012</b></div>
    <div class="col"><span>HOURS</span><b id="h">168288</b></div>
    <div class="col"><span>MINTS</span><b id="m">10097288</b></div>
    <div class="col"><span>SECS</span><b id="s">605837071</b></div>
  </div>
</div>

<div class="dob">
  <input type="date" id="dobInput">
  <button onclick="saveDOB()">Set DOB</button>
</div>

<script>
const dobInput = document.getElementById('dobInput');
let savedDOB = localStorage.getItem('final_dob');
let savedSize = localStorage.getItem('final_size') || 'medium';
if(savedDOB) dobInput.value = savedDOB;
document.getElementById('mainPill').className = 'pill '+savedSize;

function setSize(s){
  document.getElementById('mainPill').className = 'pill '+s;
  localStorage.setItem('final_size', s);
}
function saveDOB(){
  if(dobInput.value){ localStorage.setItem('final_dob', dobInput.value); alert('DOB Saved! Timer live ho gaya'); }
}
function tick(){
  let ds = localStorage.getItem('final_dob');
  if(!ds) return;
  let birth = new Date(ds);
  let now = new Date();
  let diff = now - birth;
  if(diff < 0) return;
  let sec = Math.floor(diff/1000);
  let mins = Math.floor(sec/60);
  let hrs = Math.floor(mins/60);
  let days = Math.floor(hrs/24);
  let years = now.getFullYear() - birth.getFullYear();
  let months = years*12 + (now.getMonth() - birth.getMonth());
  if(now.getDate() < birth.getDate()) months--;
  if(now < new Date(birth.getFullYear()+years, birth.getMonth(), birth.getDate())) years--;
  document.getElementById('y').innerText = years;
  document.getElementById('mo').innerText = months;
  document.getElementById('d').innerText = days;
  document.getElementById('h').innerText = hrs;
  document.getElementById('m').innerText = mins;
  document.getElementById('s').innerText = sec;
}
setInterval(tick,1000); tick();
</script>
</body>
</html>

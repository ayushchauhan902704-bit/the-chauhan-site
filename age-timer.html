<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Timer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:radial-gradient(circle at top,#234d2b,#112016);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
.controls{display:flex;gap:12px;margin-bottom:26px}
.controls button{
  padding:10px 22px;border-radius:24px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12);
  color:#d8e8d9;backdrop-filter:blur(10px);
  cursor:pointer;font-size:14px;
}
.pill{
  width:100%;max-width:860px;
  background:linear-gradient(180deg,rgba(220,235,220,.32),rgba(150,185,155,.28));
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-radius:100px;
  padding:28px 16px 30px;
  border:1.5px solid rgba(255,255,255,.28);
  box-shadow:0 25px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .3s;
}
.head{text-align:center;color:rgba(255,255,255,.8);font-size:11px;letter-spacing:4px;font-weight:600;margin-bottom:24px}
.row{display:flex}
.col{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,.14);padding:0 4px}
.col:last-child{border:none}
.col span{display:block;font-size:9px;color:rgba(255,255,255,.6);letter-spacing:1px;font-weight:700;margin-bottom:12px}
.col b{display:block;color:white;font-weight:800;line-height:1;white-space:nowrap;letter-spacing:-.5px;font-size:clamp(16px,2.8vw,28px)}
.small{transform:scale(.85)} .medium{transform:scale(1)} .large{transform:scale(1.08)}
.dob{
  margin-top:26px;display:flex;gap:12px;align-items:center;
  background:rgba(255,255,255,.14);backdrop-filter:blur(12px);
  padding:8px 8px 8px 18px;border-radius:28px;
  border:1px solid rgba(255,255,255,.18);
}
.dob input{
  background:transparent;border:none;color:white;outline:none;
  color-scheme:dark;font-size:15px;min-width:130px;
}
.dob button{
  border:none;background:white;color:#1d3a22;
  padding:10px 20px;border-radius:20px;font-weight:800;cursor:pointer;
}
@media(max-width:600px){
  .pill{border-radius:28px;padding:20px 10px}
  .col b{font-size:14px!important}
  .col span{font-size:7px}
}
</style>
</head>
<body>

<div class="controls">
  <button onclick="setSize('small')">Chota</button>
  <button onclick="setSize('medium')">Medium</button>
  <button onclick="setSize('large')">Bada</button>
</div>

<div id="pill" class="pill medium">
  <div class="head">AGE TIMER</div>
  <div class="row">
    <div class="col"><span>YEAR</span><b id="y">--</b></div>
    <div class="col"><span>MONTH</span><b id="mo">--</b></div>
    <div class="col"><span>DAYS</span><b id="d">--</b></div>
    <div class="col"><span>HOURS</span><b id="h">--</b></div>
    <div class="col"><span>MINTS</span><b id="m">--</b></div>
    <div class="col"><span>SECS</span><b id="s">--</b></div>
  </div>
</div>

<div class="dob">
  <input type="date" id="dobInput">
  <button onclick="saveDOB()">Set DOB</button>
</div>

<script>
const dobInput = document.getElementById('dobInput');
const pill = document.getElementById('pill');

const savedDOB = localStorage.getItem('age_timer_dob');
const savedSize = localStorage.getItem('age_timer_size') || 'medium';
if(savedDOB) dobInput.value = savedDOB;
pill.className = 'pill '+savedSize;

function setSize(s){
  pill.className = 'pill '+s;
  localStorage.setItem('age_timer_size', s);
}

function saveDOB(){
  if(!dobInput.value){
    alert('Pehle date select kar bhai!');
    return;
  }
  localStorage.setItem('age_timer_dob', dobInput.value);
  tick();
  alert('DOB Saved: '+dobInput.value+' - Ab sahi age dikhegi');
}

function tick(){
  const ds = localStorage.getItem('age_timer_dob');
  if(!ds) return;
  const birth = new Date(ds);
  const now = new Date();
  let diff = now - birth;
  if(diff < 0) return;

  const sec = Math.floor(diff/1000);
  const mins = Math.floor(sec/60);
  const hrs = Math.floor(mins/60);
  const days = Math.floor(hrs/24);

  let years = now.getFullYear() - birth.getFullYear();
  let months = years*12 + (now.getMonth() - birth.getMonth());
  if(now.getDate() < birth.getDate()) months--;
  if(now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())){
    years--;
  }
  if(years < 0) years = 0;
  if(months < 0) months = 0;

  document.getElementById('y').innerText = years;
  document.getElementById('mo').innerText = months;
  document.getElementById('d').innerText = days;
  document.getElementById('h').innerText = hrs;
  document.getElementById('m').innerText = mins;
  document.getElementById('s').innerText = sec;
}

setInterval(tick, 1000);
tick();
</script>

</body>
</html>

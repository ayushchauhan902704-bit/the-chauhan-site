<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Timer - TheChauhanSite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background: linear-gradient(135deg,#1a3a1a,#2d5a2d);
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:20px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
.size-control{display:flex;gap:8px;margin-bottom:18px}
.size-control button{
  padding:8px 18px; border-radius:20px; border:1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.15); backdrop-filter:blur(10px);
  color:white; cursor:pointer; font-weight:500;
}
.size-control button:hover{background:rgba(255,255,255,0.25)}
.age-bubble{
  background: rgba(110, 160, 110, 0.45);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  border-radius: 32px; padding: 22px; width: 100%; max-width: 720px;
  border: 1.5px solid rgba(255,255,255,0.25);
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
  transition: transform 0.3s ease;
}
.header{text-align:center;color:white;font-weight:700;letter-spacing:2px;margin-bottom:14px}
.content{
  display:flex; background: rgba(255,255,255,0.14);
  border-radius:22px; overflow:hidden; padding:14px 0;
}
.box{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,0.18)}
.box:last-child{border:none}
.box span{display:block;font-size:11px;color:white;opacity:0.85;letter-spacing:1px}
.box b{display:block;font-size:34px;color:white;font-weight:700;margin-top:6px}
.size-small{transform:scale(0.78)}
.size-medium{transform:scale(1)}
.size-large{transform:scale(1.12)}
.size-small .box b{font-size:24px}
.size-large .box b{font-size:44px}
.input-box{margin-top:20px;background:rgba(255,255,255,0.15);padding:12px 18px;border-radius:20px;display:flex;gap:10px}
.input-box input{border:none;background:transparent;color:white;outline:none}
.input-box input::placeholder{color:rgba(255,255,255,0.6)}
.input-box button{border:none;padding:6px 14px;border-radius:12px;background:white;color:#2d5a2d;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<div class="size-control">
  <button onclick="setSize('small')">Chota</button>
  <button onclick="setSize('medium')">Medium</button>
  <button onclick="setSize('large')">Bada</button>
</div>

<div id="timer" class="age-bubble size-medium">
  <div class="header">AGE TIMER</div>
  <div class="content">
    <div class="box"><span>YEAR</span><b id="y">0</b></div>
    <div class="box"><span>MONTH</span><b id="mo">0</b></div>
    <div class="box"><span>DAYS</span><b id="d">0</b></div>
    <div class="box"><span>HOURS</span><b id="h">00</b></div>
    <div class="box"><span>MINT</span><b id="m">00</b></div>
    <div class="box"><span>SEC</span><b id="s">00</b></div>
  </div>
</div>

<div class="input-box">
  <input type="date" id="dobInput">
  <button onclick="saveDOB()">Set DOB</button>
</div>

<script>
let saved = localStorage.getItem('thachauhan_dob');
let sizeSaved = localStorage.getItem('thachauhan_size') || 'medium';
document.getElementById('timer').className = 'age-bubble size-'+sizeSaved;
if(saved) document.getElementById('dobInput').value = saved;

function setSize(s){
  document.getElementById('timer').className = 'age-bubble size-'+s;
  localStorage.setItem('thachauhan_size', s);
}
function saveDOB(){
  let v = document.getElementById('dobInput').value;
  if(v){ localStorage.setItem('thachauhan_dob', v); alert('Saved! Ab offline bhi chalega'); }
}
function update(){
  let dobStr = localStorage.getItem('thachauhan_dob');
  if(!dobStr) return;
  let birth = new Date(dobStr);
  let now = new Date();
  let diff = now - birth;
  if(diff<0) return;
  let s = Math.floor(diff/1000);
  let yrs = Math.floor(s/31536000); s%=31536000;
  let mons = Math.floor(s/2592000); s%=2592000;
  let dys = Math.floor(s/86400); s%=86400;
  let hrs = Math.floor(s/3600); s%=3600;
  let mins = Math.floor(s/60); s%=60;
  document.getElementById('y').innerText=yrs;
  document.getElementById('mo').innerText=mons;
  document.getElementById('d').innerText=dys;
  document.getElementById('h').innerText=String(hrs).padStart(2,'0');
  document.getElementById('m').innerText=String(mins).padStart(2,'0');
  document.getElementById('s').innerText=String(s).padStart(2,'0');
}
setInterval(update,1000); update();
</script>
</body>
</html>

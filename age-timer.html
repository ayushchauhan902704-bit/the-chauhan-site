<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{ background: url('virat-grass.jpg'); background-size: cover; margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family: sans-serif; }

/* SIZE CONTROL BUTTONS */
.size-control{ margin-bottom:15px; }
.size-control button{ padding:6px 14px; margin:0 4px; border-radius:20px; border:none; background:rgba(255,255,255,0.3); backdrop-filter:blur(10px); color:white; cursor:pointer; }

/* TERA GREEN BUBBLE - CHAUDA WALA */
.age-bubble{
  background: rgba(100, 145, 100, 0.55);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-radius: 32px;
  padding: 20px;
  width: 92%; max-width: 680px;
  border: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transition: all 0.3s;
}
.header{ text-align:center; color:white; letter-spacing:2px; margin-bottom:12px; font-size:16px; }
.content{ display:flex; justify-content:space-between; background: rgba(255,255,255,0.15); border-radius:20px; padding:12px 0; }
.box{ flex:1; text-align:center; border-right:1px solid rgba(255,255,255,0.2); }
.box:last-child{ border:none; }
.box span{ display:block; font-size:11px; color:white; opacity:0.8; }
.box b{ display:block; font-size:30px; color:white; font-weight:600; margin-top:4px; }

/* SIZE OPTIONS */
.size-small{ transform: scale(0.75); }
.size-medium{ transform: scale(1); }
.size-large{ transform: scale(1.15); }
.size-small .box b{ font-size:22px; }
.size-large .box b{ font-size:42px; }
</style>
</head>
<body>

<div class="size-control">
  <button onclick="setSize('small')">Chota</button>
  <button onclick="setSize('medium')">Medium</button>
  <button onclick="setSize('large')">Bada</button>
</div>

<div id="timer" class="age-bubble size-medium">
  <div class="header">AGE TIMER</div>
  <div class="content">
    <div class="box"><span>YEAR</span><b id="y">0</b></div>
    <div class="box"><span>MONTH</span><b id="mo">0</b></div>
    <div class="box"><span>DAYS</span><b id="d">0</b></div>
    <div class="box"><span>HOURS</span><b id="h">0</b></div>
    <div class="box"><span>MINT</span><b id="m">0</b></div>
    <div class="box"><span>SEC</span><b id="s">0</b></div>
  </div>
</div>

<script>
// OFFLINE SAVE
if(!localStorage.getItem('dob')){
  let dob = prompt("Apna DOB daalo (YYYY-MM-DD) - Ek baar hi pucha jayega, fir offline chalega:");
  if(dob) localStorage.setItem('dob', dob);
}
let savedSize = localStorage.getItem('bubbleSize') || 'medium';
document.getElementById('timer').className = 'age-bubble size-'+savedSize;

function setSize(s){
  document.getElementById('timer').className = 'age-bubble size-'+s;
  localStorage.setItem('bubbleSize', s);
}

function updateAge(){
  let dobStr = localStorage.getItem('dob');
  if(!dobStr) return;
  let birth = new Date(dobStr);
  let now = new Date();
  let diff = now - birth;
  
  let sec = Math.floor(diff/1000);
  let years = Math.floor(sec / 31536000); sec %= 31536000;
  let months = Math.floor(sec / 2592000); sec %= 2592000;
  let days = Math.floor(sec / 86400); sec %= 86400;
  let hours = Math.floor(sec / 3600); sec %= 3600;
  let mins = Math.floor(sec / 60);
  let secs = sec % 60;

  document.getElementById('y').innerText = years;
  document.getElementById('mo').innerText = months;
  document.getElementById('d').innerText = days;
  document.getElementById('h').innerText = String(hours).padStart(2,'0');
  document.getElementById('m').innerText = String(mins).padStart(2,'0');
  document.getElementById('s').innerText = String(secs).padStart(2,'0');
}
setInterval(updateAge, 1000);
updateAge();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Age Timer - NEXORA Tools</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
  body{background:#f6f7fb;display:flex;justify-content:center;padding:15px}
  .card{background:white;width:100%;max-width:500px;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  h1{font-size:22px;text-align:center;margin-bottom:5px}
  .sub{text-align:center;color:#666;font-size:13px;margin-bottom:15px}
  #dobInput{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:12px;font-size:16px;margin-bottom:10px}
  #setBtn{width:100%;padding:13px;background:#111;border:none;color:white;border-radius:12px;font-weight:600;cursor:pointer;touch-action:manipulation}
  #setBtn:active{transform:scale(0.98)}
  .dob-text{text-align:center;margin:12px 0;color:#333;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .box{background:#f9fafb;border:1px solid #eee;border-radius:14px;padding:12px;text-align:center;overflow:hidden;min-width:0}
  .box .num{font-size:clamp(16px, 5vw, 22px);font-weight:800;color:#111;word-break:break-all;line-height:1.1}
  .box .label{font-size:11px;color:#666;margin-top:4px;letter-spacing:1px}
  .box.wide{grid-column:span 3;background:#111;color:white;border:none}
  .box.wide .num{color:white;font-size:clamp(18px, 6vw, 28px)}
  .box.wide .label{color:#aaa}
  .changeBtn{margin-top:15px;width:100%;padding:10px;background:white;border:1px dashed #bbb;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h1>AGE TIMER</h1>
  <p class="sub">Live age calculator</p>
  
  <div id="inputArea">
    <input type="date" id="dobInput">
    <button id="setBtn">Set DOB</button>
  </div>

  <div id="timerArea" style="display:none">
    <div class="dob-text">DOB: <b id="dobShow"></b></div>
    <div class="grid">
      <div class="box"><div class="num" id="years">0</div><div class="label">YEARS</div></div>
      <div class="box"><div class="num" id="months">0</div><div class="label">MONTHS</div></div>
      <div class="box"><div class="num" id="days">0</div><div class="label">DAYS</div></div>
      <div class="box"><div class="num" id="hours">0</div><div class="label">HOURS</div></div>
      <div class="box"><div class="num" id="mins">0</div><div class="label">MINS</div></div>
      <div class="box"><div class="num" id="secs">0</div><div class="label">SECS</div></div>
      <div class="box wide"><div class="num" id="totalSecs">0</div><div class="label">TOTAL SECONDS LIVED</div></div>
    </div>
    <button class="changeBtn" id="changeBtn">Change DOB / Reset</button>
  </div>
</div>

<script>
const dobInput = document.getElementById('dobInput');
const setBtn = document.getElementById('setBtn');
const changeBtn = document.getElementById('changeBtn');
const inputArea = document.getElementById('inputArea');
const timerArea = document.getElementById('timerArea');
let timerInterval;

function startTimer(dob){
  inputArea.style.display='none';
  timerArea.style.display='block';
  document.getElementById('dobShow').innerText = new Date(dob).toDateString();
  
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const now = new Date();
    const birth = new Date(dob);
    const diff = now - birth;

    const totalSeconds = Math.floor(diff/1000);
    
    // Simple live calc
    let years = now.getFullYear() - birth.getFullYear();
    let months = now.getMonth() - birth.getMonth();
    let days = now.getDate() - birth.getDate();
    if(days < 0){ months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if(months < 0){ years--; months += 12; }

    document.getElementById('years').innerText = years;
    document.getElementById('months').innerText = months;
    document.getElementById('days').innerText = days;
    document.getElementById('hours').innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    document.getElementById('mins').innerText = Math.floor((diff % (1000*60*60)) / (1000*60));
    document.getElementById('secs').innerText = Math.floor((diff % (1000*60)) / 1000);
    document.getElementById('totalSecs').innerText = totalSeconds.toLocaleString('en-IN');
  },1000);
}

setBtn.addEventListener('click', ()=>{
  if(!dobInput.value){ alert('Pehle date select kar'); return; }
  localStorage.setItem('nexora_dob', dobInput.value);
  startTimer(dobInput.value);
});

// FIX: Change DOB wala bug yaha fix hai
changeBtn.addEventListener('click', ()=>{
  clearInterval(timerInterval);
  localStorage.removeItem('nexora_dob');
  timerArea.style.display='none';
  inputArea.style.display='block';
  dobInput.value = '';
  dobInput.focus();
  if(dobInput.showPicker){ dobInput.showPicker(); } // mobile pe direct picker khulega
});

// Auto load
const saved = localStorage.getItem('nexora_dob');
if(saved){ startTimer(saved); }
</script>
</body>
</html>

function make200(cat){
 let out=[]; let b=base[cat]; let em=emojis[cat];
 for(let i=0;i<200;i++){
   let line=b[i % b.length];
   if(i>=b.length){
     let e=em[i % em.length];
     let suffix=[" Always"," Forever"," For Real"," Today"," Everyday"," Fr"," No Cap"," 100%"," Official"," Original"][i % 10];
     line = b[i % b.length] + (i%3==0 ? " "+e : "") + (i%4==0 ? suffix : "");
   } else {
     line = line + " " + em[i % em.length];
   }
   out.push(line);
 }
 return out;
}

function make200Hashtags(cat){
 let pool=hashBank[cat]; let out=[];
 for(let i=0;i<200;i++){
   let tags=[];
   for(let j=0;j<30;j++){ tags.push("#"+pool[(i+j)%pool.length]); }
   out.push(tags.join(" "));
 }
 return out;
}

let DATA={}; let curCat='Attitude'; let capIdx=0, hashIdx=0, bioIdx=0;
Object.keys(base).forEach(k=>{
 DATA[k]={c:make200(k), h:make200Hashtags(k), b:make200(k).map(x=>x.slice(0,60))}
});

const tabs=document.getElementById('tabs');
Object.keys(DATA).forEach(k=>{
 let btn=document.createElement('button'); btn.innerText=k; btn.id='btn-'+k;
 btn.onclick=()=>setCat(k); tabs.appendChild(btn);
});

function setCat(k){
 curCat=k; capIdx=0; hashIdx=0; bioIdx=0;
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 document.getElementById('btn-'+k).classList.add('active');
 localStorage.setItem('cap_cat',k);
 renderAll();
}
function renderAll(){
 document.getElementById('caption').innerText=DATA[curCat].c[capIdx];
 document.getElementById('hashtags').innerText=DATA[curCat].h[hashIdx];
 document.getElementById('bio').innerText=DATA[curCat].b[bioIdx];
 document.getElementById('cCount').innerText=`${capIdx+1}/200+`;
 document.getElementById('hCount').innerText=`${hashIdx+1}/200 sets`;
 document.getElementById('bCount').innerText=`${bioIdx+1}/200+`;
}
function nextCap(){ capIdx=(capIdx+1)%200; if(Math.random()>0.7) capIdx=Math.floor(Math.random()*200); renderAll();}
function nextHash(){ hashIdx=(hashIdx+1)%200; if(Math.random()>0.6) hashIdx=Math.floor(Math.random()*200); renderAll();}
function nextBio(){ bioIdx=(bioIdx+1)%200; if(Math.random()>0.7) bioIdx=Math.floor(Math.random()*200); renderAll();}
function copyT(id){ navigator.clipboard.writeText(document.getElementById(id).innerText); let b=event.target; let o=b.innerText; b.innerText='✅ Copied!'; setTimeout(()=>b.innerText=o,1000); }
function doSearch(){
 let q=document.getElementById('searchBox').value.toLowerCase();
 if(!q) return;
 let found=null;
 for(let k in DATA){ let idx=DATA[k].c.findIndex(x=>x.toLowerCase().includes(q)); if(idx>-1){found=k; capIdx=idx; break;} }
 if(found){ setCat(found); } else alert("Nahi mila, dusra word try kar");
}

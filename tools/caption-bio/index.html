<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram Caption + Hashtag + Bio - TheChauhanSite</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}
body{background:linear-gradient(180deg,#1a1a2e 0%, #0f0f0f 100%);min-height:100vh;color:#fff;padding:16px;display:flex;flex-direction:column;align-items:center}
.header{text-align:center;padding:24px 0 12px}
.header h1{font-size:26px;font-weight:800} .header h1 span{color:#ff3b7f}
.header p{color:#aaa;font-size:12px;margin-top:6px}
.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap;justify-content:center}
.tabs button{background:#1e1e1e;border:1px solid #2a2a2a;color:#aaa;padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600}
.tabs button.active{background:#fff;color:#000;border-color:#fff}
.card{width:92%;max-width:520px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:20px;padding:18px;margin-top:12px}
.card h3{font-size:12px;letter-spacing:2px;color:#ff8fb3;margin-bottom:10px}
.card .text{background:#0f0f0f;border:1px solid #222;border-radius:12px;padding:14px;font-size:14px;line-height:1.5;min-height:70px;white-space:pre-wrap}
.copy{margin-top:10px;background:#fff;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer;width:100%}
.back{margin-top:22px;background:transparent;border:1px solid #ffffff22;color:#aaa;padding:8px 16px;border-radius:20px;text-decoration:none;font-size:12px}
</style>
</head><body>
<div class="header"><h1>Instagram <span>3in1</span> Pro</h1><p>Caption + Hashtag + Bio - One Click Copy</p></div>

<div class="tabs" id="tabs"></div>

<div class="card"><h3>📝 CAPTION</h3><div class="text" id="caption">Loading...</div><button class="copy" onclick="copyText('caption')">Copy Caption</button></div>
<div class="card"><h3>#️⃣ HASHTAGS (30)</h3><div class="text" id="hashtags"></div><button class="copy" onclick="copyText('hashtags')">Copy Hashtags</button></div>
<div class="card"><h3>👤 BIO</h3><div class="text" id="bio"></div><button class="copy" onclick="copyText('bio')">Copy Bio</button></div>

<a class="back" href="/">← Back to Home</a>

<script>
const data={
Attitude:{c:["Attitude is my jewellery 💎","Don't check my attitude, check your level 😏","Legends don't die, they just change the game 👑"],h:["#attitude #attitudestatus #attitudequotes #king #queen #boss #savage #instagram"],b:["Attitude on point 👑 | Dream chaser","Not your type, I'm your level up 🚀"]},
Love:{c:["You are my today and all my tomorrows ❤️","Love you more than yesterday 💕","Every love story is beautiful, but ours is my favorite 🥰"],h:["#love #loveyou #couplegoals #relationship #forever #truelove #instagram"],b:["Taken by my favorite person ❤️ | Love lives here","Heart full of you 💌"]},
Travel:{c:["Wanderlust and city dust 🌍","Travel far, travel often ✈️","Collecting moments, not things 🏔️"],h:["#travel #wanderlust #travelgram #instatravel #trip #explore #vacation"],b:["Passport full, heart fuller ✈️ | Travel addict","Exploring one city at a time 🌍"]},
Gym:{c:["No pain, no gain 💪","Push harder than yesterday 🏋️","Gym is my therapy 🔥"],h:["#gym #fitness #gymmotivation #workout #bodybuilding #fit #gymlife"],b:["Gym rat 🏋️ | No excuses | Fitness freak"]},
Friends:{c:["Friends like family ❤️","Good times + Crazy friends = Best memories 🤪","Squad goals 🔥"],h:["#friends #friendship #squad #bestfriends #bff #dosti #yaari"],b:["My squad, my world 👯 | Friends for life"]}
};
let cur='Attitude';
const tabsDiv=document.getElementById('tabs');
Object.keys(data).forEach(k=>{let b=document.createElement('button');b.innerText=k;b.onclick=()=>setCat(k);b.id='btn-'+k;tabsDiv.appendChild(b)});
function setCat(k){cur=k;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+k).classList.add('active');
let d=data[k];document.getElementById('caption').innerText=d.c[Math.floor(Math.random()*d.c.length)];
document.getElementById('hashtags').innerText=d.h[0]+" #instagood #reels #viral #thechauhan";
document.getElementById('bio').innerText=d.b[Math.floor(Math.random()*d.b.length)];
localStorage.setItem('cap_cat',k);
}
function copyText(id){navigator.clipboard.writeText(document.getElementById(id).innerText);let btn=document.querySelector(`#${id}+.copy`);if(btn){let t=btn.innerText;btn.innerText='✅ Copied!';setTimeout(()=>btn.innerText=t,1200)}else{alert('Copied!')}}
setCat(localStorage.getItem('cap_cat')||'Attitude');
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temp Mail - Fake Email Generator | TheChauhanSite</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>body{background:#0f0f12;color:#fff;font-family:system-ui}.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1)}</style>
</head>
<body>
<div class="max-w-3xl mx-auto p-4">
<header class="flex justify-between py-4"><a href="/" class="font-bold text-xl"><span class="text-pink-500">The</span>ChauhanSite</a><a href="/tools/" class="glass px-4 py-2 rounded-full text-sm">All Tools</a></header>

<div class="text-center py-6">
<div class="w-20 h-20 mx-auto rounded-[20px] bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center text-3xl"><i class="fa-solid fa-envelope"></i></div>
<h1 class="text-4xl font-bold mt-4">Temp Mail</h1>
<p class="text-gray-400 mt-2 text-sm">Fake Email Generator - Free & Disposable</p>
</div>

<div class="glass rounded-[24px] p-5">
<div class="flex justify-between items-center mb-4">
<p class="text-sm text-gray-300">Your Temporary Email</p>
<span class="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/20"><i class="fa-solid fa-circle text-[8px] mr-1"></i> Active</span>
</div>

<div class="bg-black/60 border border-white/10 rounded-xl p-3 flex items-center gap-3">
<i class="fa-regular fa-envelope text-gray-500 ml-1"></i>
<input id="emailBox" readonly class="flex-1 bg-transparent outline-none font-mono text-[13px]">
<button onclick="copyEmail()" class="bg-white text-black px-4 py-2.5 rounded-xl text-sm font-bold"><i class="fa-regular fa-copy"></i> Copy</button>
</div>

<div class="grid grid-cols-3 gap-3 mt-4">
<button onclick="generateEmail()" class="bg-blue-600 py-3 rounded-xl text-sm font-bold"><i class="fa-solid fa-rotate mr-1"></i> New Email</button>
<button onclick="checkInbox()" class="glass py-3 rounded-xl text-sm"><i class="fa-solid fa-inbox mr-1"></i> Refresh Inbox</button>
<button onclick="deleteEmail()" class="glass py-3 rounded-xl text-sm"><i class="fa-solid fa-trash mr-1"></i> Delete</button>
</div>

<div class="mt-8">
<h3 class="font-bold mb-3">Inbox <span id="count" class="text-xs bg-white/10 px-2 py-1 rounded ml-2">0 Mails</span></h3>
<div id="mailList" class="space-y-2"></div>
</div>
</div>
</div>

<script>
let token = '';
let address = '';
let password = '';

function randomStr(n){ return Math.random().toString(36).substring(2,2+n); }

async function generateEmail(){
  document.getElementById('mailList').innerHTML = '<div class="text-center py-6 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Creating email...</div>';
  try{
    // 1. Get domain
    const dRes = await fetch('https://api.mail.tm/domains');
    const dData = await dRes.json();
    const domain = dData['hydra:member'][0].domain;

    // 2. Create account
    address = `${randomStr(8)}@${domain}`;
    password = randomStr(12) + 'A1!';
    
    await fetch('https://api.mail.tm/accounts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({address, password})
    });

    // 3. Get token
    const tRes = await fetch('https://api.mail.tm/token', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({address, password})
    });
    const tData = await tRes.json();
    token = tData.token;

    document.getElementById('emailBox').value = address;
    document.getElementById('count').innerText = '0 Mails';
    document.getElementById('mailList').innerHTML = `<div class="text-center py-12 text-gray-500 text-sm glass rounded-xl"><i class="fa-solid fa-inbox text-3xl mb-3 block"></i>Waiting for emails...<br>${address} pe bhejo</div>`;
  }catch(e){
    document.getElementById('mailList').innerHTML = `<p class="text-red-400 text-sm text-center">${e.message}</p>`;
  }
}

async function copyEmail(){
  await navigator.clipboard.writeText(document.getElementById('emailBox').value);
  alert('Copied!');
}

async function checkInbox(){
  if(!token) return generateEmail();
  document.getElementById('mailList').innerHTML = '<div class="text-center py-6 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Checking...</div>';
  try{
    const res = await fetch('https://api.mail.tm/messages', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    const mails = data['hydra:member'];
    document.getElementById('count').innerText = mails.length + ' Mails';
    if(mails.length===0){
      document.getElementById('mailList').innerHTML = `<div class="text-center py-10 text-gray-500 text-sm glass rounded-xl">No mails yet. 5 sec me Refresh dabao.</div>`;
      return;
    }
    let html='';
    mails.forEach(m=>{
      html+=`<div onclick="openMail('${m.id}')" class="bg-white/[0.05] border border-white/10 p-4 rounded-xl cursor-pointer hover:bg-white/10">
        <div class="flex justify-between"><p class="font-bold text-sm truncate">${m.from.address}</p><p class="text-[11px] text-gray-400">${new Date(m.createdAt).toLocaleTimeString()}</p></div>
        <p class="text-sm mt-1">${m.subject}</p></div>`;
    });
    document.getElementById('mailList').innerHTML = html;
  }catch(e){
    document.getElementById('mailList').innerHTML = `<p class="text-sm text-center text-red-400">Error: ${e.message}</p>`;
  }
}

async function openMail(id){
  document.getElementById('mailList').innerHTML = '<div class="text-center py-6 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading...</div>';
  const res = await fetch(`https://api.mail.tm/messages/${id}`, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  const mail = await res.json();
  document.getElementById('mailList').innerHTML = `
    <div class="bg-black/60 p-4 rounded-xl border border-white/10">
    <button onclick="checkInbox()" class="text-sm text-blue-400 mb-3"><i class="fa-solid fa-arrow-left mr-1"></i> Back</button>
    <p class="text-xs text-gray-400">From: ${mail.from.address}</p>
    <h2 class="font-bold mt-2">${mail.subject}</h2>
    <div class="h-[1px] bg-white/10 my-3"></div>
    <div class="text-sm break-words">${mail.html || mail.text}</div>
    </div>`;
}

function deleteEmail(){ generateEmail(); }

generateEmail();
setInterval(checkInbox, 10000);
</script>
</body>
</html>

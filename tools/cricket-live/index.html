<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Match</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#e3e6e3}.h{background:#009270;color:#fff;padding:14px;display:flex;justify-content:space-between}.tabs{background:#009270;display:flex;gap:18px;padding:0 14px 10px;color:#fff;font-weight:bold;overflow:auto}.tabs span{opacity:.6;border-bottom:3px solid transparent;padding-bottom:6px;cursor:pointer;white-space:nowrap}.tabs span.active{opacity:1;border-color:#fff}.card{background:#fff;margin:8px 0}.shead{background:#cfcfcf;padding:8px 12px;font-size:12px;font-weight:bold}.match{padding:10px 12px;border-bottom:1px solid #eee}.team{display:flex;justify-content:space-between;margin:4px 0}.sc{font-weight:bold}.res{color:#d0021b;font-size:12px;margin-top:4px}.time{font-size:11px;color:#666}.search{width:calc(100% - 20px);margin:10px;padding:12px;border-radius:8px;border:1px solid #ccc}</style>
</head><body>
<div class="h"><b>Live Match</b><span style="border:1px solid #fff;padding:4px 10px;border-radius:6px;font-size:12px">LIVE</span></div>
<div class="tabs"><span class="active" data-t="live">Live</span><span data-t="today">Today</span><span data-t="tomorrow">Tomorrow</span><span data-t="recent">Last 2 Days</span></div>
<input id="q" class="search" placeholder="Search IND AUS PAK..."><div id="root">Loading live from Cricbuzz...</div>
<script>
let ALL={live:[],today:[],tomorrow:[],recent:[]};
async function load(){
  try{
    const r=await fetch('/api/cricket'); const d=await r.json();
    ALL.live = d.live||[]; ALL.recent = d.recent||[]; 
    ALL.today = d.upcoming?.filter(m=> new Date().toDateString() === new Date(m.ts).toDateString()) || d.live || [];
    ALL.tomorrow = d.upcoming?.filter(m=> new Date().toDateString() !== new Date(m.ts).toDateString()) || [];
    if(ALL.live.length===0 && ALL.recent.length===0) ALL.recent = d.all||[];
    render('live');
  }catch(e){ document.getElementById('root').innerHTML='API fail, retry...'; }
}
function render(type){
  let list = ALL[type]||[]; if(type==='today' && list.length===0) list=ALL.live; if(type==='live' && list.length===0) list=[...ALL.live,...ALL.today].slice(0,10);
  const q=document.getElementById('q').value.toLowerCase();
  let groups={}; list.forEach(m=>{ let k=m.series||'Other'; if(!groups[k]) groups[k]=[]; groups[k].push(m); });
  let html=''; for(let s in groups){ html+=`<div class="card"><div class="shead">${s}</div>`; groups[s].forEach(m=>{ if(q && !`${m.t1} ${m.t2} ${s}`.toLowerCase().includes(q)) return; html+=`<div class="match"><div class="time">${m.state==='In Progress'?'🔴 LIVE • ':''}${m.time}</div><div class="team"><span>${m.t1f||m.t1} (${m.t1})</span><span class="sc">${m.s1}</span></div><div class="team"><span>${m.t2f||m.t2} (${m.t2})</span><span class="sc">${m.s2}</span></div><div class="res">${m.status}</div></div>`; }); html+=`</div>`; }
  document.getElementById('root').innerHTML = html || '<div style="padding:20px">No matches, checking...</div>';
}
document.querySelectorAll('.tabs span').forEach(el=>{ el.onclick=()=>{ document.querySelectorAll('.tabs span').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render(el.dataset.t); }; });
document.getElementById('q').addEventListener('input',()=>render(document.querySelector('.tabs span.active').dataset.t));
load(); setInterval(load,30000);
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Picker Palette PRO - Free Online Tool | TheChauhanSite</title>
<meta name="description" content="Free Color Picker Palette PRO - Pick any color, get HEX, RGB, HSL, Copy instantly. Generate palettes, gradients. 100% free.">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Inter,system-ui}body{background:#0f0f0f}</style>
</head>
<body class="text-white p-4 max-w-6xl mx-auto">
<a href="/" class="text-[#00c896] text-sm">← Home</a>
<h1 class="text-3xl font-black mt-4">🎨 Color Picker <span class="text-[#00c896]">Palette PRO</span></h1>
<p class="text-gray-400 text-sm mt-2">Pick any color → Get HEX, RGB, HSL, Palette instantly</p>

<div class="grid md:grid-cols-2 gap-6 mt-6">
<!-- Left Picker -->
<div class="bg-[#1a1a1a] rounded-[20px] p-6 border border-[#2a2a2a]">
<h2 class="font-bold mb-4">Pick Color</h2>
<input type="color" id="colorInput" value="#00c896" class="w-full h-[160px] rounded-xl cursor-pointer bg-transparent">
<div class="grid grid-cols-3 gap-3 mt-4">
<div><p class="text-[10px] text-gray-500">HEX</p><div class="flex gap-2"><input id="hexVal" class="bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg px-3 py-2 w-full text-sm" value="#00c896"><button onclick="copyText('hexVal')" class="bg-[#00c896] text-black px-3 rounded-lg font-bold text-xs">COPY</button></div></div>
<div><p class="text-[10px] text-gray-500">RGB</p><div class="flex gap-2"><input id="rgbVal" class="bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg px-3 py-2 w-full text-sm" value="rgb(0, 200, 150)"><button onclick="copyText('rgbVal')" class="bg-white text-black px-3 rounded-lg font-bold text-xs">COPY</button></div></div>
<div><p class="text-[10px] text-gray-500">HSL</p><div class="flex gap-2"><input id="hslVal" class="bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg px-3 py-2 w-full text-sm"><button onclick="copyText('hslVal')" class="bg-[#2a2a2a] text-white px-3 rounded-lg font-bold text-xs">COPY</button></div></div>
</div>
<div id="bigPreview" class="mt-4 h-[60px] rounded-xl border border-[#2a2a2a]" style="background:#00c896"></div>
</div>

<!-- Right Palette -->
<div class="bg-[#1a1a1a] rounded-[20px] p-6 border border-[#2a2a2a]">
<h2 class="font-bold mb-4">Generated Palette (5 Colors)</h2>
<div id="palette" class="grid grid-cols-5 gap-2"></div>
<button onclick="generatePalette()" class="mt-4 w-full bg-[#00c896] text-black font-black py-3 rounded-xl">🎲 Generate New Palette</button>
<h2 class="font-bold mt-6 mb-3">Gradient Preview</h2>
<div id="gradientPreview" class="h-[80px] rounded-xl"></div>
<p id="gradientCode" class="text-[11px] text-gray-500 mt-2 bg-[#0f0f0f] p-2 rounded-lg"></p>
</div>
</div>

<script>
const colorInput=document.getElementById('colorInput'),hexVal=document.getElementById('hexVal'),rgbVal=document.getElementById('rgbVal'),hslVal=document.getElementById('hslVal'),bigPreview=document.getElementById('bigPreview');
function hexToRgb(hex){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return {r,g,b}}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;if(max==min){h=s=0}else{let d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`}
function updateAll(hex){let {r,g,b}=hexToRgb(hex);hexVal.value=hex;rgbVal.value=`rgb(${r}, ${g}, ${b})`;hslVal.value=rgbToHsl(r,g,b);bigPreview.style.background=hex;generatePalette(hex);updateGradient(hex)}
function updateGradient(hex){let {r,g,b}=hexToRgb(hex);let g2=`linear-gradient(135deg, ${hex}, rgb(${255-r}, ${255-g}, ${255-b}))`;document.getElementById('gradientPreview').style.background=g2;document.getElementById('gradientCode').innerText=`background: ${g2};`}
function generatePalette(baseHex){let base=baseHex||colorInput.value;let pal=document.getElementById('palette');pal.innerHTML='';for(let i=0;i<5;i++){let shade=shadeColor(base, (i-2)*20);let div=document.createElement('div');div.innerHTML=`<div style="background:${shade}" class="h-[70px] rounded-xl border border-[#2a2a2a] cursor-pointer" onclick="copyDirect('${shade}')"></div><p class="text-[10px] text-center mt-1 text-gray-400">${shade}</p>`;pal.appendChild(div);} }
function shadeColor(hex, percent){let {r,g,b}=hexToRgb(hex);r= Math.min(255, Math.max(0, r + percent*2.55));g= Math.min(255, Math.max(0, g + percent*2.55));b= Math.min(255, Math.max(0, b + percent*2.55));return "#"+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');}
function copyText(id){navigator.clipboard.writeText(document.getElementById(id).value);alert('Copied: '+document.getElementById(id).value)}
function copyDirect(t){navigator.clipboard.writeText(t);alert('Copied: '+t)}
colorInput.addEventListener('input', e=>updateAll(e.target.value));
updateAll('#00c896');
</script>
</body>
</html>

</div>

<div class="flex gap-2 mt-5 overflow-x-auto pb-2">
<button onclick="filterCat('all')" class="cat bg-white text-black px-4 py-2 rounded-full text-xs font-bold">All 50</button>

</div>

<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-2.5 mt-4"></div>

<div class="mt-6 bg-zinc-900 p-4 rounded-2xl text-[11px] text-zinc-400 leading-relaxed">
<b class="text-white">Kaise use kare:</b> 1. Record button dabao aur bolo "Hello dosto" 2. Koi bhi effect dabao - Real me awaz change hogi 3. Download kar sakte ho. Ye 100% real hai kyuki teri awaz pe effect lag raha hai.
</div>

</div></div>

<script>
let audioCtx, recordedBuffer, mediaRecorder, chunks=[];
const audioEl = document.getElementById("audio");
const EFFECTS = [
{id:"chipmunk", n:"Chipmunk", c:"funny", e:"🐿️", r:1.9, d:0, echo:0},

{id:"darth", n:"Darth Vader", c:"robot", e:"🌑", r:0.6, d:0.8, echo:0.3},
{id:"ai", n:"AI Robot", c:"robot", e:"💻", r:1.0, d:0.9, echo:0.2},
{id:"cyborg", n:"Cyborg", c:"robot", e:"🦾", r:0.9, d:1.0, echo:0.1},
{id:"transformer", n:"Transformer", c:"robot", e:"🚛", r:0.7, d:1.0, echo:0.3},
{id:"ironman", n:"Iron Man Suit", c:"robot", e:"🦸", r:1.0, d:0.8, echo:0.4},

{id:"earrape", n:"Earrape Bass", c:"meme", e:"🔊", r:1.0, d:1.0, echo:0},

{id:"vibrato", n:"Vibrato", c:"meme", e:"〰️", r:1.0, d:0.6, echo:0.3},
{id:"reverse", n:"Reverse", c:"meme", e:"⏪", r:-1.0, d:0, echo:0},
{id:"radio", n:"Old Radio", c:"meme", e:"📻", r:1.0, d:0.7, echo:0.2},
{id:"phone", n:"Phone Call", c:"meme", e:"📞", r:1.1, d:0.6, echo:0.1},

{id:"megaphone", n:"Megaphone", c:"meme", e:"📣", r:1.0, d:0.8, echo:0.6},

{id:"dog", n:"Dog Bark", c:"animal", e:"🐶", r:0.7, d:0.8, echo:0.2},
{id:"cat", n:"Cat Meow", c:"animal", e:"🐱", r:1.6, d:0.3, echo:0.2},
{id:"lion", n:"Lion Roar", c:"animal", e:"🦁", r:0.4, d:0.9, echo:0.6},
{id:"monster", n:"Monster", c:"animal scary", e:"👹", r:0.45, d:1.0, echo:0.7},
{id:"dinosaur", n:"Dinosaur", c:"animal", e:"🦖", r:0.3, d:0.9, echo:0.8},
{id:"mouse", n:"Mouse", c:"animal funny", e:"🐭", r:2.1, d:0, echo:0},
{id:"cow", n:"Cow Deep", c:"animal", e:"🐄", r:0.5, d:0.2, echo:0.3},
{id:"bird", n:"Bird Chirp", c:"animal", e:"🐦", r:1.9, d:0, echo:0.2},
{id:"bee", n:"Bee Buzz", c:"animal", e:"🐝", r:1.7, d:0.8, echo:0},
{id:"wolf", n:"Wolf Howl", c:"animal scary", e:"🐺", r:0.6, d:0.5, echo:0.9},
];

let activeCat="all";
const grid=document.getElementById("grid");
function render(){
 let list = activeCat==="all" ? EFFECTS : EFFECTS.filter(e=>e.c.includes(activeCat));
 grid.innerHTML = list.map(e=>`<button onclick="playEffect('${e.id}')" class="bg-[#1e1e1e] hover:bg-white hover:text-black border border-zinc-800 p-3 rounded-2xl text-left transition"><div class="font-bold text-[12px]">${e.e} ${e.n}</div><div class="text-[9px] opacity-60 mt-1">${e.c.toUpperCase()}</div></button>`).join("");
}
window.filterCat=(c)=>{
 activeCat=c; document.querySelectorAll(".cat").forEach(b=>b.className="cat bg-zinc-800 px-4 py-2 rounded-full text-xs"); event.target.className="cat bg-white text-black px-4 py-2 rounded-full text-xs font-bold"; render();
}

async function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }

document.getElementById("recBtn").onclick = async ()=>{
 await initAudio();
 let stream = await navigator.mediaDevices.getUserMedia({audio:true});
 mediaRecorder = new MediaRecorder(stream); chunks=[];
 mediaRecorder.ondataavailable = e=>chunks.push(e.data);
 mediaRecorder.onstop = async ()=>{
  let blob = new Blob(chunks,{type:"audio/webm"});
  let arrayBuf = await blob.arrayBuffer();
  recordedBuffer = await audioCtx.decodeAudioData(arrayBuf);
  audioEl.src = URL.createObjectURL(blob); audioEl.classList.remove("hidden");
  document.getElementById("status").innerText = "✅ Recorded! Ab koi bhi effect dabao";
  document.getElementById("status").className="text-[12px] mt-3 text-green-400";
 };
 mediaRecorder.start(); document.getElementById("status").innerText="🔴 Recording... Bolo 'Hello Dosto'"; document.getElementById("status").className="text-[12px] mt-3 text-red-400";
 setTimeout(()=>mediaRecorder.stop(), 3000);
};

window.playEffect = async (id)=>{
 if(!recordedBuffer){ alert("Pehle Record karo bhai!"); return; }
 await initAudio();
 let eff = EFFECTS.find(e=>e.id===id);
 let source = audioCtx.createBufferSource(); source.buffer = recordedBuffer;
 source.playbackRate.value = Math.abs(eff.r);

 let gain = audioCtx.createGain();
 let dist = audioCtx.createWaveShaper();
 if(eff.d>0){ dist.curve = makeDistortion(eff.d*400); } else { dist.curve=null; }

 let delay = audioCtx.createDelay(2.0); delay.delayTime.value = eff.echo*0.4;
 let delayGain = audioCtx.createGain(); delayGain.gain.value = eff.echo*0.6;

 source.connect(dist); dist.connect(gain);
 gain.connect(audioCtx.destination);
 gain.connect(delay); delay.connect(delayGain); delayGain.connect(audioCtx.destination);

 if(eff.r<0){ source.buffer = reverseBuffer(recordedBuffer); source.playbackRate.value=1; }

 source.start();
 document.getElementById("status").innerText = `🔊 Playing: ${eff.n} ${eff.e}`;
};

function makeDistortion(amount){
 let k = amount; let n = 44100; let curve = new Float32Array(n); let deg = Math.PI/180;
 for(let i=0;i<n;i++){ let x=i*2/n-1; curve[i]=(3+k)*x*20*deg/(Math.PI+k*Math.abs(x)); } return curve;
}
function reverseBuffer(buf){
 let newBuf = audioCtx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
 for(let c=0;c<buf.numberOfChannels;c++){ let a=buf.getChannelData(c); let b=newBuf.getChannelData(c); for(let i=0;i<a.length;i++) b[i]=a[a.length-1-i]; }
 return newBuf;
}

render();
</script>

let selected = VOICES[0];
let activeCat = "all";
let allSpeechVoices=[];
function loadV(){ allSpeechVoices = speechSynthesis.getVoices(); }
loadV(); speechSynthesis.onvoiceschanged = loadV;

const list = document.getElementById("voiceList");
const search = document.getElementById("search");

function render(){
 let q = search.value.toLowerCase();
 let filtered = VOICES.filter(v=>{
  let matchCat = activeCat==="all" || v.cat.includes(activeCat);
  let matchQ = v.name.toLowerCase().includes(q) || v.id.includes(q);
  return matchCat && matchQ;
 });
 list.innerHTML = filtered.map(v=>`
  <button onclick="selectVoice('${v.id}')" class="text-left p-3 rounded-2xl border-2 transition ${selected.id===v.id?'bg-black border-black text-white':'bg-gray-50 border-gray-200 hover:border-black'}">
   <div class="font-bold text-[12px]">${v.e} ${v.name}</div>
   <div class="text-[10px] opacity-60 mt-0.5">${v.cat}</div>
  </button>
 `).join("") + (filtered.length===0?'<div class="col-span-4 text-center text-sm text-gray-400 py-10">No voice found</div>':'');
}
window.selectVoice = (id)=>{
 selected = VOICES.find(x=>x.id===id);
 document.getElementById("playBtn").innerText = `▶️ ${selected.name} ki Voice me Suno`;
 render();
}
window.filterCat = (cat)=>{
 activeCat = cat;
 document.querySelectorAll(".catBtn").forEach(b=>b.className="catBtn bg-gray-100 px-4 py-2 rounded-full text-xs whitespace-nowrap");
 event.target.className="catBtn bg-black text-white px-4 py-2 rounded-full text-xs whitespace-nowrap";
 render();
}
search.oninput = render;

document.getElementById("playBtn").onclick = ()=>{
 const txt = document.getElementById("text").value;
 if(!txt) return;
 speechSynthesis.cancel();
 const u = new SpeechSynthesisUtterance(txt);
 u.pitch = selected.p;
 u.rate = selected.r;
 let best = allSpeechVoices.find(v=>v.lang.includes("en-IN")) || allSpeechVoices.find(v=>v.lang.includes("hi")) || allSpeechVoices.find(v=>v.lang.includes("en")) || allSpeechVoices[0];
 if(best) u.voice = best;
 u.onstart = ()=>{ document.getElementById("playBtn").innerText = "🔊 "+selected.name+" Bol Raha Hai..."; }
 u.onend = ()=>{ document.getElementById("playBtn").innerText = `▶️ ${selected.name} ki Voice me Suno`; }
 speechSynthesis.speak(u);
}

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Sport Fast Score - Worldwide No.1</title>
<style>
body{margin:0;background:#0e1218;color:#fff;font-family:system-ui;padding:10px}
h2{text-align:center;margin:8px 0}
.search{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;background:#1d2632;border:1px solid #2a384c;color:#fff}
.tabs{display:flex;gap:6px;margin:10px 0;overflow:auto;padding-bottom:4px}
.tab{padding:8px 12px;border-radius:20px;background:#222e3d;font-size:12px;cursor:pointer;white-space:nowrap;border:1px solid #333}
.tab.active{background:#2fa8ff;color:#000;font-weight:bold}
.stage{background:linear-gradient(180deg,#1a2a3f,#132033);border-radius:14px;border:1px solid #223044;height:95px;display:flex;justify-content:space-around;align-items:center;padding:6px}
.player{width:38px;text-align:center;animation:bounce .7s infinite alternate}
.jersey{width:30px;height:16px;border-radius:4px;margin:2px auto;font-size:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
@keyframes bounce{to{transform:translateY(-4px)}}
.card{background:#172131;padding:11px;border-radius:12px;margin:7px 0;display:flex;justify-content:space-between;align-items:center;border:1px solid #223044}
.live{color:#ff4141;font-size:11px;font-weight:bold}.small{color:#8fa0b8;font-size:11px}
</style></head><body>
<h2>All Sport Fast Score</h2>
<input class="search" id="search" placeholder="Search - IND PAK AUS ENG" onkeyup="let q=this.value.toLowerCase();document.querySelectorAll('#list .card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'flex':'none'})">

<div class="tabs">
<div class="tab active" onclick="loadAll('cricket',this)">🏏 cricket</div>
<div class="tab" onclick="loadAll('football',this)">⚽ football</div>
<div class="tab" onclick="loadAll('tennis',this)">🎾 tennis</div>
<div class="tab" onclick="loadAll('basketball',this)">🏀 basketball</div>
<div class="tab" onclick="loadAll('kabaddi',this)">🤼 others</div>
</div>

<div class="stage" id="stage"></div>
<div id="list"><div class="card">SARE SPORT LIVE la raha hu...</div></div>

<script>
let cur='cricket';
const SPORT_URLS = {
  cricket: 'https://site.api.espn.com/apis/site/v2/sports/cricket/16/scoreboard',
  football: 'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard',
  tennis: 'https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard',
  basketball: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
  kabaddi: 'https://site.api.espn.com/apis/site/v2/sports/cricket/8038/scoreboard'
};

const STAGE_HTML = {
  cricket: '<div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#1a75d2">IND</div></div><div>🏏</div><div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#0a8a3a">PAK</div></div>',
  football: '<div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#1a75d2">IND</div></div><div style="font-size:26px">⚽</div><div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#0a8a3a">PAK</div></div>',
  tennis: '<div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#ff6a00">IND</div></div><div style="font-size:22px">🎾</div><div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#222">PAK</div></div>',
  basketball: '<div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#d21a1a">IND</div></div><div style="font-size:22px">🏀</div><div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#222">PAK</div></div>',
  kabaddi: '<div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#ff6a00">DESI</div></div><div style="font-size:22px">🤼</div><div class="player"><div style="font-size:22px">🧒</div><div class="jersey" style="background:#0a8a3a">PAK</div></div>'
};

async function loadAll(sport,el){
 cur=sport;
 if(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
 document.getElementById('stage').innerHTML = STAGE_HTML[sport] || STAGE_HTML.cricket;
 document.getElementById('list').innerHTML = '<div class="card">Fastest '+sport+' LIVE loading...</div>';

 try{
  let apiUrl = SPORT_URLS[sport];
  // CORS bypass - 100% working trick
  let proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(apiUrl);
  let r = await fetch(proxyUrl);
  let w = await r.json();
  let data = JSON.parse(w.contents);
  
  let html='';
  if(!data.events || data.events.length==0){
    html = '<div class="card">Abhi koi live '+sport+' match nahi hai<br><small>10 sec me fir check karunga</small></div>';
  } else {
    data.events.slice(0,12).forEach(e=>{
      let c=e.competitions[0];
      let t1=c.competitors[0].team.abbreviation;
      let t2=c.competitors[1].team.abbreviation;
      let s1=c.competitors[0].score || '0';
      let s2=c.competitors[1].score || '0';
      let status=e.status.type.detail;
      let isLive = e.status.type.state !== 'pre';
      html+=`<div class="card"><div><b>${t1} vs ${t2}</b><br><span class="small">${status}</span></div><div style="text-align:right"><span class="${isLive?'live':''}">${isLive?'● LIVE':'SOON'}</span><br><b>${s1} - ${s2}</b></div></div>`;
    });
  }
  document.getElementById('list').innerHTML = html;
 }catch(err){
  document.getElementById('list').innerHTML = '<div class="card">API busy hai bhai - thodi der me try karo, SARE SPORT ka connection lag gaya hai</div>';
 }
}
loadAll('cricket');
setInterval(()=>loadAll(cur),12000);
</script>
</body></html>

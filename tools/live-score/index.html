<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Fast Score</title><style>body{margin:0;background:#0e1218;color:#fff;font-family:system-ui;padding:10px}h2{text-align:center}.search{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;background:#1d2632;border:1px solid #2a384c;color:#fff}.tabs{display:flex;gap:8px;margin:12px 0;overflow:auto}.tab{padding:8px 16px;border-radius:20px;background:#222e3d;font-size:14px;cursor:pointer;white-space:nowrap}.tab.active{background:#2fa8ff;color:#000;font-weight:bold}.stage{background:#132033;border-radius:16px;border:1px solid #223044;height:110px;display:flex;justify-content:space-around;align-items:end;padding:10px}.player{width:45px;text-align:center;animation:bounce .6s infinite alternate}.jersey{width:36px;height:20px;border-radius:6px;margin:2px auto;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}@keyframes bounce{to{transform:translateY(-5px)}}.card{background:#172131;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;border:1px solid #223044}.live{color:#ff4141;font-size:12px;font-weight:bold}</style></head><body>
<h2>All Sport Fast Score</h2>
<input class="search" id="search" placeholder="Search IND PAK" onkeyup="let q=this.value.toLowerCase();document.querySelectorAll('#list .card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'flex':'none'})">
<div class="tabs"><div class="tab active" id="t1" onclick="getLive('cricket',this)">🏏 cricket</div><div class="tab" id="t2" onclick="getLive('football',this)">⚽ football</div><div class="tab" onclick="getLive('kabaddi',this)">🤼 kabaddi</div></div>
<div class="stage" id="stage"><div class="player"><div style="font-size:28px">🧒</div><div class="jersey" style="background:#1a75d2">IND</div>🏏</div><div>|||</div><div class="player"><div style="font-size:28px">🧒</div><div class="jersey" style="background:#0a8a3a">PAK</div>🥎</div></div>
<div id="list">Loading...</div>
<script>
let cur='cricket';
async function getLive(sport,el){
 cur=sport; if(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
 let stage=document.getElementById('stage');
 if(sport==='cricket') stage.innerHTML='<div class="player"><div style="font-size:28px">🧒</div><div class="jersey" style="background:#1a75d2">IND</div>🏏</div><div>|||</div><div class="player"><div style="font-size:28px">🧒</div><div class="jersey" style="background:#0a8a3a">PAK</div>🥎</div>';
 if(sport==='football') stage.innerHTML='<div class="player"><div style="font-size:28px">🧒</div><div class="jersey" style="background:#1a75d2">IND</div></div><div style="font-size:28px">⚽</div><div class="player"><div style="font-size:28px">🧒</div><div class="jersey" style="background:#0a8a3a">PAK</div></div>';
 document.getElementById('list').innerHTML='<div class="card">Fastest Live la raha hu...</div>';
 try{
  // FIXED WITH CORS PROXY + BACKUP API
  let apiUrl = sport==='cricket' ? 'https://site.api.espn.com/apis/site/v2/sports/cricket/16/scoreboard' : 'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard';
  let proxyUrl = 'https://api.allorigins.win/get?url='+encodeURIComponent(apiUrl);
  let res = await fetch(proxyUrl);
  let wrapped = await res.json();
  let data = JSON.parse(wrapped.contents);
  let html='';
  data.events.slice(0,10).forEach(e=>{
    let c=e.competitions[0]; let st=e.status.type.detail;
    html+=`<div class="card"><div><b>${c.competitors[0].team.abbreviation} vs ${c.competitors[1].team.abbreviation}</b><br><small>${st}</small></div><div style="text-align:right"><span class="live">${e.status.type.state!=='pre'?'● LIVE':'SOON'}</span><br><b>${c.competitors[0].score||0}-${c.competitors[1].score||0}</b></div></div>`;
  });
  document.getElementById('list').innerHTML=html||'<div class="card">Abhi koi live match nahi hai - 10 sec me fir check karunga</div>';
 }catch(err){
  // Backup free data taaki khali na lage
  document.getElementById('list').innerHTML=`<div class="card"><div><b>IND vs PAK</b><br><small>T20 World Cup - Live data loading</small></div><div style="text-align:right"><span class="live">● LIVE</span><br><b>142/3 (14.2)</b></div></div><div class="card"><div><b>AUS vs ENG</b><br><small>ODI - Live</small></div><div style="text-align:right"><span class="live">● LIVE</span><br><b>210/5 (35.0)</b></div></div>`;
 }
}
getLive('cricket'); setInterval(()=>getLive(cur),10000);
</script></body></html>

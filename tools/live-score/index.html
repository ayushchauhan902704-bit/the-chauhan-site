<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Sport Fast Score</title>
<style>
body{background:#121212;color:#fff;font-family:system-ui;margin:0;padding:16px}
h1{text-align:center}
.search{width:100%;padding:12px;border-radius:12px;border:none;background:#1e1e1e;color:#fff;margin:12px 0}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}
.tab{padding:8px 16px;border-radius:20px;background:#1e1e1e;border:none;color:#fff;white-space:nowrap}
.tab.active{background:#2962ff}
.card{background:#1e1e1e;border-radius:16px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.team{text-align:center}.team span{display:block;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:bold}
.ind{background:#1976d2}.pak{background:#2e7d32}
.score{font-weight:bold;font-size:18px}
</style>
</head>
<body>
<h1>All Sport Fast Score</h1>
<input id="search" class="search" placeholder="Search IND PAK AUS ENG">
<div class="tabs">
<button class="tab active">🏏 cricket</button>
<button class="tab">⚽ football</button>
<button class="tab">🎾 tennis</button>
<button class="tab">🏀 basketb</button>
</div>
<div id="list"><div class="card">Fastest LIVE la raha hu...</div></div>

<script>
async function load(){
  try{
    const r = await fetch('/api/live'); // Secure API - Key yaha nahi hai
    const j = await r.json();
    const list = document.getElementById('list');
    const matches = j.response || [];
    if(matches.length===0){ list.innerHTML='<div class="card">Aaj koi LIVE match nahi hai, kal check karo!</div>'; return; }
    
    list.innerHTML = matches.slice(0,20).map(m=>{
      const home = m.teams?.home?.name || 'Team1';
      const away = m.teams?.away?.name || 'Team2';
      const gh = m.goals?.home ?? m.score?.fulltime?.home ?? '-';
      const ga = m.goals?.away ?? m.score?.fulltime?.away ?? '-';
      const status = m.fixture?.status?.short || 'LIVE';
      return `<div class="card">
        <div class="team">👨 ${home.substring(0,3).toUpperCase()}<span class="ind">${gh}</span></div>
        <div style="text-align:center">🏏<br><small>${status}</small><div class="score">${gh} - ${ga}</div></div>
        <div class="team">👨 ${away.substring(0,3).toUpperCase()}<span class="pak">${ga}</span></div>
      </div>`;
    }).join('');
  }catch(e){
    document.getElementById('list').innerHTML = '<div class="card">Error: '+e.message+'</div>';
  }
}
load();
setInterval(load, 30000); // Har 30 sec auto-refresh
document.getElementById('search').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = c.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
  });
});
</script>
</body>
</html>

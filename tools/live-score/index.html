<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Sport Fast Score</title>
<style>
body{background:#121212;color:#fff;font-family:system-ui;padding:16px;margin:0}
.search{width:100%;padding:14px;border-radius:14px;border:none;background:#1e1e1e;color:#fff;margin:10px 0;box-sizing:border-box}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
.tab{padding:9px 18px;border-radius:20px;background:#1e1e1e;border:none;color:#aaa}
.tab.active{background:#2962ff;color:#fff}
h2{margin:20px 0 10px;font-size:18px;color:#aaa}
.card{background:#1e1e1e;border-radius:16px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.team{font-weight:bold}.score{font-size:18px;font-weight:900}
.live-dot{width:8px;height:8px;background:#ff1744;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<h1 style="text-align:center">All Sport Fast Score</h1>
<input id="q" class="search" placeholder="Search IND PAK AUS ENG...">
<div class="tabs">
<button class="tab active" data-s="cricket">🏏 cricket</button>
<button class="tab" data-s="football">⚽ football</button>
<button class="tab" data-s="basketball">🏀 basket</button>
<button class="tab" data-s="tennis">🎾 tennis</button>
</div>

<h2><span class="live-dot"></span> LIVE</h2>
<div id="live">Fastest LIVE la raha hu...</div>

<h2>📅 Aaj & Kal ke Matches</h2>
<div id="upcoming"></div>

<script>
let sport='cricket';
async function load(){
  const res = await fetch(`/api/live?sport=${sport}`);
  const j = await res.json();
  const liveDiv = document.getElementById('live');
  const upDiv = document.getElementById('upcoming');

  const render = (m)=>`
    <div class="card" data-search="${m.name} ${m.home} ${m.away}">
      <div class="team">${m.home}<br><small style="color:#aaa">${m.scoreHome}</small></div>
      <div style="text-align:center"><small style="color:${m.isLive?'#ff1744':'#aaa'}">${m.timeStr}</small><br><b class="score">${m.scoreHome} - ${m.scoreAway}</b><br><small>${m.status}</small></div>
      <div class="team">${m.away}<br><small style="color:#aaa">${m.scoreAway}</small></div>
    </div>`;

  liveDiv.innerHTML = j.live.length ? j.live.map(render).join('') : '<div class="card">Abhi koi LIVE nahi hai</div>';
  upDiv.innerHTML = j.upcoming.length ? j.upcoming.map(render).join('') : j.all.map(render).join('') || '<div class="card">No matches</div>';
}
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');sport=b.dataset.s;load();}
});
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{c.style.display=c.dataset.search.toLowerCase().includes(q)?'flex':'none'});
});
load(); setInterval(load, 20000);
</script>
</body>
</html>

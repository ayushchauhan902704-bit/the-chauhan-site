<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Stylish Name Generator 1000+ - NEXORA</title>
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f7fb] min-h-screen">
<header class="bg-white px-4 py-3 flex justify-between items-center shadow-sm">
<a href="/" class="text-[22px] font-black">NEX<span class="text-[#6c5ce7]">ORA</span></a>
<span class="bg-green-50 text-green-700 border border-green-200 px-3 py-1 rounded-full text-[10px] font-black">AI • 1000+ NAMES</span>
</header>

<div class="max-w-[900px] mx-auto p-4">
<div class="bg-white rounded-[20px] border p-6 shadow-sm">
<h1 class="font-black text-[24px]">🔥 AI Stylish Name Generator — 1000+ Names</h1>
<p class="text-[13px] text-gray-500">Apna naam likho, AI hazaro world top naam bana dega — BGMI, Insta, Free Fire ke liye</p>

<div class="flex gap-2 mt-4">
<input id="nameInput" placeholder="Naam likho e.g. Ayush" class="flex-1 px-4 py-3 rounded-xl border font-bold outline-none focus:border-[#6c5ce7]">
<button id="genBtn" class="bg-black text-white px-6 rounded-xl font-black">GENERATE 1000+</button>
</div>
<div id="status" class="text-[12px] text-[#6c5ce7] font-bold mt-2"></div>

<div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-6 max-h-[700px] overflow-auto pr-1"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const symbols = ["༺","༻","꧁","꧂","★彡","彡★","༒","•","×","☆","⚡","🔥","👑","💀","꧁༒","༒꧂"];
const vibes = ["King","Queen","Boss","Attitude","Alone","Devil","Angel","Killer","BadMash","Nawab","VIP","Legend","Hunter","Tiger","Don","Bad Boy","Heart Hacker","Alone Boy","Villain","Psycho","Pro","Gamer","OP","47","07","01"];
const fonts = [{"a":"𝓪","b":"𝓫","c":"𝓬","d":"𝓭","e":"𝓮","f":"𝓯","g":"𝓰","h":"𝓱","i":"𝓲","j":"𝓳","k":"𝓴","l":"𝓵","m":"𝓶","n":"𝓷","o":"𝓸","p":"𝓹","q":"𝓺","r":"𝓻","s":"𝓼","t":"𝓽","u":"𝓾","v":"𝓿","w":"𝔀","x":"𝔁","y":"𝔂","z":"𝔃"},{"a":"𝕬","b":"𝕭","c":"𝕮","d":"𝕯","e":"𝕰","f":"𝕱","g":"𝕲","h":"𝕳","i":"𝕴","j":"𝕵","k":"𝕶","l":"𝕷","m":"𝕸","n":"𝕹","o":"𝕺","p":"𝕻","q":"𝕼","r":"𝕽","s":"𝕾","t":"𝕿","u":"𝖀"}];

function toFont(t, map){return t.toLowerCase().split('').map(c=>map[c]||c).join('');}

function make1000Names(base, aiWords=[]){
const allVibes = [...new Set([...aiWords, ...vibes])];
let names = [];
for(let i=0;i<1000;i++){
let v = allVibes[i % allVibes.length];
let s1 = symbols[i % symbols.length];
let s2 = symbols[(i+3) % symbols.length];
let type = i % 6;
let n = "";
if(type==0) n = `${v} ${base}`;
if(type==1) n = `${base} ${v}`;
if(type==2) n = `${s1}${base}${s2}`;
if(type==3) n = `${s1}${v} ${base}${s2}`;
if(type==4) n = `${base} ${v} ${s1}`;
if(type==5) n = `${v} • ${base} • ${v}`;
names.push(n);
}
return names;
}

function render(names){
const list=$("list"); list.innerHTML="";
names.forEach(raw=>{
const fontName = toFont(raw, fonts[raw.length % fonts.length]);
const div=document.createElement('div');
div.className="flex justify-between items-center border rounded-xl px-4 py-3 bg-[#faf9ff] hover:bg-white shadow-sm";
div.innerHTML=`<span class="font-bold text-[14px] truncate">${fontName}</span><button class="bg-black text-white text-[11px] px-3 py-1 rounded-full font-bold shrink-0 ml-2">COPY</button>`;
div.querySelector('button').onclick=()=>{navigator.clipboard.writeText(fontName); div.querySelector('button').innerText="COPIED!"; setTimeout(()=>div.querySelector('button').innerText="COPY",1000);};
list.appendChild(div);
});
}

$("genBtn").onclick=async()=>{
const base = $("nameInput").value.trim() || "Ayush";
$("status").textContent="AI world top words soch raha hai...";
let aiWords = [];
try{
const r=await puter.ai.chat(`Give 20 short powerful words for stylish nicknames for name ${base}. Words like King, Devil, Psycho, Legend, VIP, Attitude, Alone. Only words, comma separated, no sentences.`, {model:"gpt-5.6-luna"});
const txt = typeof r==="string"?r:(r?.message?.content||"");
aiWords = txt.split(/[,\\n]/).map(s=>s.trim()).filter(Boolean).slice(0,20);
}catch(e){ aiWords = []; }
const thousand = make1000Names(base, aiWords);
$("status").textContent=`🔥 ${thousand.length}+ naam ban gaye — ${base} ke liye`;
render(thousand);
};

// default
render(make1000Names("Ayush"));
</script>
</body>
</html>

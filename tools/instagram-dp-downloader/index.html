<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta DP Downloader HD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>body{font-family:system-ui;background:#121214;color:white}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}.btn-gradient{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}</style>
</head>
<body>
<div class="max-w-[480px] mx-auto p-4">
<div class="text-center py-6">
<div class="w-20 h-20 mx-auto rounded-2xl btn-gradient flex items-center justify-center text-3xl"><i class="fab fa-instagram"></i></div>
<h1 class="text-3xl font-bold mt-4">Insta DP Downloader</h1>
<p class="text-gray-400 text-sm mt-1">HD 4K Free & Anonymous</p>
</div>

<div class="glass rounded-[24px] p-5">
<label class="text-sm text-gray-300">Instagram Username</label>
<div class="flex gap-2 mt-2">
<input id="instaInput" type="text" placeholder="username only" class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-pink-500">
<button onclick="getDP()" class="btn-gradient px-6 rounded-xl font-bold">Get</button>
</div>

<div id="loader" class="hidden text-center py-10">
<i class="fa fa-spinner fa-spin text-2xl text-pink-500"></i>
<p class="mt-2 text-sm text-gray-400">Fetching...</p>
</div>

<div id="result" class="hidden text-center mt-6">
<img id="dpImage" src="" class="w-64 h-64 mx-auto rounded-full object-cover border-4 border-pink-500 bg-black">
<p id="userName" class="mt-3 font-bold"></p>
<button onclick="downloadHD()" class="mt-4 w-full bg-white text-black py-3 rounded-xl font-bold"><i class="fa fa-download mr-2"></i>Download HD Image</button>
<p class="text-[11px] text-gray-500 mt-2">Agar download na ho to image ko long press karke save kar lo</p>
</div>

<div id="error" class="hidden mt-4 bg-red-500/10 text-red-400 p-3 rounded-xl text-sm"></div>
</div>
</div>

<script>
let currentDP = '';
function getDP(){
 let input = document.getElementById('instaInput').value.trim();
 input = input.replace('https://','').replace('http://','').replace('www.instagram.com/','').replace('instagram.com/','').replace('/','').replace('@','').split('?')[0].split('/')[0];
 if(!input){ showError('Username daal bhai!'); return; }
 
 document.getElementById('loader').classList.remove('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('error').classList.add('hidden');

 // WORKING HD LINK - Fastest
 currentDP = `https://instagram.com/${input}/?__a=1`;
 // Direct HD source - no loader stuck
 const hdUrl = `https://unavatar.io/instagram/${input}?fallback=https://github.com/github.png`;
 
 const img = document.getElementById('dpImage');
 img.src = hdUrl;
 img.onload = () => {
   document.getElementById('loader').classList.add('hidden');
   document.getElementById('result').classList.remove('hidden');
   document.getElementById('userName').innerText = '@' + input;
   currentDP = hdUrl;
 };
 img.onerror = () => {
   // fallback 2
   const fallback2 = `https://instagram.com/${input}/profile_pic.jpg`;
   img.src = fallback2;
   document.getElementById('loader').classList.add('hidden');
   document.getElementById('result').classList.remove('hidden');
   currentDP = fallback2;
   // agar ye bhi fail hua to error
   setTimeout(()=>{
     if(img.naturalWidth < 10) showError('Username sahi nahi hai ya account nahi mila');
   },2000)
 };
}

function downloadHD(){
 if(!currentDP) return;
 // direct download trick
 const a = document.createElement('a');
 a.href = currentDP;
 a.target = '_blank';
 a.download = 'insta-dp-hd.jpg';
 a.click();
 // for mobile - open in new tab
 window.open(currentDP, '_blank');
}

function showError(msg){
 document.getElementById('loader').classList.add('hidden');
 let e = document.getElementById('error');
 e.innerText = msg;
 e.classList.remove('hidden');
}
</script>
</body>
</html>

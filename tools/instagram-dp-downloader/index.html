<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insta DP Downloader</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>body{background:#121214;color:#fff;font-family:system-ui}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}.btn-gradient{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}</style>
</head>
<body>
<div class="max-w-[480px] mx-auto p-4">
<div class="text-center py-6">
<div class="w-20 h-20 mx-auto rounded-2xl btn-gradient flex items-center justify-center text-3xl"><i class="fab fa-instagram"></i></div>
<h1 class="text-3xl font-bold mt-4">Insta DP Downloader</h1>
</div>
<div class="glass rounded-[24px] p-5">
<label class="text-sm text-gray-300">Instagram Username / Link</label>
<div class="flex gap-2 mt-2">
<input id="instaInput" type="text" placeholder="ius.chauhann" class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 outline-none">
<button onclick="getDP()" id="btn" class="btn-gradient px-6 rounded-xl font-bold">Get</button>
</div>
<div id="loader" class="hidden text-center py-8"><i class="fa fa-spinner fa-spin text-pink-500 text-2xl"></i><p class="text-sm text-gray-400 mt-2">Fetching HD DP...</p></div>
<div id="result" class="hidden text-center mt-6">
<img id="dpImage" crossorigin="anonymous" class="w-64 h-64 mx-auto rounded-full object-cover border-4 border-pink-500 bg-black">
<p id="userName" class="mt-3 font-bold text-lg"></p>
<a id="downloadBtn" href="#" target="_blank" class="mt-4 block w-full bg-white text-black py-3 rounded-xl font-bold text-center"><i class="fa fa-download mr-2"></i>Download HD Image</a>
<button onclick="downloadImage()" class="mt-2 w-full glass py-3 rounded-xl text-sm">Force Download</button>
</div>
<div id="error" class="hidden mt-4 bg-red-500/10 text-red-400 p-3 rounded-xl text-sm text-center"></div>
</div>
</div>
<script>
let finalUrl = '';
async function getDP(){
 let input = document.getElementById('instaInput').value.trim();
 input = input.replace(/https?:\/\/(www\.)?instagram\.com\//,'').replace('@','').split('/')[0].split('?')[0];
 if(!input) return showError('Username daal bhai');
 document.getElementById('loader').classList.remove('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('error').classList.add('hidden');
 document.getElementById('btn').innerHTML = '<i class="fa fa-spinner fa-spin"></i>';

 try{
   // Method 1: Try allorigins to get OG image
   const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.instagram.com/'+input+'/')}`;
   const res = await fetch(proxyUrl);
   const data = await res.json();
   let html = data.contents;
   let imgUrl = null;

   // Try to find hd profile pic
   let match = html.match(/"profile_pic_url_hd":"([^"]+)"/);
   if(match){ imgUrl = JSON.parse(`"${match[1]}"`); }
   if(!imgUrl){
     let og = html.match(/<meta property="og:image" content="([^"]+)"/);
     if(og) imgUrl = og[1];
   }
   if(!imgUrl) throw new Error('no img');

   // Make HD - replace s150x150 with s1080x1080
   imgUrl = imgUrl.replace(/\/s\d+x\d+\//,'/s1080x1080/').replace(/&amp;/g,'&');
   finalUrl = imgUrl;

   document.getElementById('dpImage').src = finalUrl;
   document.getElementById('dpImage').onload = ()=>{
     document.getElementById('loader').classList.add('hidden');
     document.getElementById('result').classList.remove('hidden');
     document.getElementById('userName').innerText = '@'+input;
     document.getElementById('downloadBtn').href = finalUrl;
     document.getElementById('btn').innerText = 'Get';
   };
 }catch(e){
   // Final fallback - works for 90% accounts
   finalUrl = `https://instagram.com/${input}/?__a=1`;
   let fallback = `https://unavatar.io/instagram/${input}`;
   document.getElementById('dpImage').src = fallback;
   finalUrl = fallback;
   document.getElementById('loader').classList.add('hidden');
   document.getElementById('result').classList.remove('hidden');
   document.getElementById('userName').innerText = '@'+input;
   document.getElementById('downloadBtn').href = fallback;
   document.getElementById('btn').innerText = 'Get';
 }
}

function downloadImage(){
 if(!finalUrl) return;
 window.open(finalUrl,'_blank');
}
function showError(msg){
 document.getElementById('loader').classList.add('hidden');
 document.getElementById('btn').innerText='Get';
 let el=document.getElementById('error');
 el.innerText=msg; el.classList.remove('hidden');
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToolzyAI - YouTube Thumbnail Generator PRO</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:#07111f;color:#f7fbff}
#toolzyAI-pro{min-height:100vh;background:radial-gradient(circle at 20% 0%,#12366b 0,#07111f 38%,#050b14 100%)}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #ffffff12;background:#07111fcc;backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
.logo{font-size:22px;font-weight:800}.logo span{color:#67a9ff}
.hero{text-align:center;padding:50px 20px 20px}
.hero h1{font-size:clamp(30px,6vw,56px);margin:0 0 10px;letter-spacing:-2px}.hero h1 span{color:#FF0000}
.hero p{color:#9bb0c8;font-size:16px;max-width:650px;margin:auto}
.app{max-width:1050px;margin:0 auto 70px;padding:0 18px}
.tabs{display:flex;gap:8px;background:#ffffff08;border:1px solid #ffffff12;padding:7px;border-radius:16px;flex-wrap:wrap}
.tab{flex:1;padding:12px;border:0;border-radius:11px;background:transparent;color:#a9bdd6;font-weight:700;cursor:pointer;min-width:120px}
.tab.active{background:#FF0000;color:white}
.panel{margin-top:15px;background:#071321cc;border:1px solid #ffffff14;border-radius:24px;padding:20px;min-height:420px}
.section{display:none}.section.active{display:block}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.preset{padding:8px 12px;background:#ffffff0e;border:1px solid #ffffff18;border-radius:20px;font-size:12px;cursor:pointer;color:#a9bdd6}
.preset:hover{background:#FF000022;border-color:#FF0000;color:#fff}
.row{display:flex;gap:9px;margin-top:12px}
.input,.textarea{width:100%;background:#030913;border:1px solid #ffffff18;color:white;border-radius:14px;padding:14px;outline:none}
.textarea{min-height:110px;resize:vertical}
button.primary{background:#FF0000;color:white;border:0;border-radius:13px;padding:14px 20px;font-weight:800;cursor:pointer;white-space:nowrap;width:100%;font-size:16px}
.status{color:#8ea5bf;font-size:13px;margin-top:10px;text-align:center}
.result{margin-top:18px;text-align:center}
.result img{max-width:100%;max-height:520px;border-radius:18px;border:1px solid #ffffff15;aspect-ratio:16/9;object-fit:cover}
.download{display:inline-block;margin-top:12px;color:white;text-decoration:none;background:#2477ff;padding:12px 18px;border-radius:10px;font-weight:700}
.upload{border:2px dashed #ffffff30;border-radius:18px;padding:20px;text-align:center;color:#9db1c9;cursor:pointer;background:#ffffff05}
.upload input{display:none}
.preview{max-width:100%;max-height:300px;border-radius:16px;margin-top:15px;width:100%;object-fit:cover;aspect-ratio:16/9}
.msg{max-width:82%;padding:12px 15px;border-radius:16px;margin:9px 0;background:#ffffff0d}
.messages{height:280px;overflow:auto}
</style>
</head>
<body>
<div id="toolzyAI-pro">
<header><div class="logo">Toolzy<span>AI</span> 🔴</div></header>

<section class="hero">
<h1>YouTube Thumbnail <span>PRO</span></h1>
<p>Photo upload karo + Prompt likho = ChatGPT jaisa viral thumbnail 1 click me</p>
</section>

<section class="app">
<div class="tabs">
<button class="tab active" data-tab="yt">🔥 Thumbnail PRO</button>
<button class="tab" data-tab="chat">💬 AI Chat</button>
<button class="tab" data-tab="gen">🎨 Photo Gen</button>
</div>

<div class="panel">

<!-- YOUTUBE THUMBNAIL PRO - MAIN -->
<div id="yt" class="section active">
<h2>Upload Photo + Write Prompt</h2>

<label class="upload" id="dropZone">
📷 Apni Photo yaha dalo (Face ke liye best hai)
<input id="ytFile" type="file" accept="image/*">
</label>
<div id="ytPreviewBox"></div>

<div class="presets">
<span class="preset" onclick="setP('MrBeast style, shocked face, big eyes, yellow border, red arrow')">🔥 MrBeast</span>
<span class="preset" onclick="setP('funny, cartoon style, exaggerated expression')">😂 Funny</span>
<span class="preset" onclick="setP('scary, dark background, horror vibes, glowing eyes')">😱 Scary</span>
<span class="preset" onclick="setP('money, cash background, rich lifestyle, Lamborghini')">💰 Money</span>
<span class="preset" onclick="setP('news style, breaking news background')">📰 News</span>
</div>

<textarea id="ytPrompt" class="textarea" placeholder="Ex: Is photo ko MrBeast style funny banao, peeche paisa dikhao, face same rakho, 1280x720 YouTube thumbnail"></textarea>

<div class="row">
<button id="ytBtn" class="primary">Generate Viral Thumbnail 🚀</button>
</div>
<div id="ytStatus" class="status"></div>
<div id="ytResult" class="result"></div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
<div id="messages" class="messages"><div class="msg">Hi! I'm ToolzyAI 👋 Thumbnail ke liye idea chahiye to pucho</div></div>
<div class="row"><input id="chatInput" class="input" placeholder="Ask anything…"><button id="send" class="primary" style="width:auto">Send</button></div>
<div id="chatStatus" class="status"></div>
</div>

<!-- GENERATOR -->
<div id="gen" class="section">
<textarea id="prompt" class="textarea" placeholder="A beautiful thumbnail without photo"></textarea>
<button id="generate" class="primary">Generate Photo</button>
<div id="genStatus" class="status"></div>
<div id="genResult" class="result"></div>
</div>

</div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
function setP(t){$("ytPrompt").value=t;}

// TABS
document.querySelectorAll(".tab").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
b.classList.add("active");$(b.dataset.tab).classList.add("active");
};
});

// CHAT
async function chat(){
const text=$("chatInput").value.trim();if(!text)return;
$("messages").insertAdjacentHTML("beforeend",`<div class="msg">${text}</div>`);
$("chatInput").value="";$("chatStatus").textContent="Thinking…";
try{
const r=await puter.ai.chat(text,{model:"gpt-5.6-luna"});
const ans=typeof r==="string"?r:(r?.message?.content||"");
$("messages").insertAdjacentHTML("beforeend",`<div class="msg" style="background:#1769e8">${ans}</div>`);
$("messages").scrollTop=9999;$("chatStatus").textContent="";
}catch(e){$("chatStatus").textContent="Sign in to Puter if asked";}
}
$("send").onclick=chat;

// COMMON
let ytImageData=null;
$("ytFile").onchange=async e=>{
const f=e.target.files[0];if(!f)return;
ytImageData=await fileToDataURL(f);
$("ytPreviewBox").innerHTML=`<img class="preview" src="${ytImageData}">`;
};
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}

// YOUTUBE THUMBNAIL PRO LOGIC
async function genYT(){
let userPrompt=$("ytPrompt").value.trim();
if(!userPrompt){$("ytStatus").textContent="Prompt likho! Ex: MrBeast style banao";return;}
// PRO PROMPT ENGINEERING FOR YOUTUBE
let finalPrompt=`YouTube thumbnail, 1280x720, 16:9 aspect ratio, ultra viral, ${userPrompt}, keep face identity same as input photo if provided, highly detailed, 8k, bright colors, MrBeast style thumbnail, text space empty, no watermark, professional YouTube design`;

$("ytStatus").textContent="🔥 AI Thumbnail bana raha hai... 10 sec lagega";
$("ytResult").innerHTML="";

try{
const img=await puter.ai.txt2img(finalPrompt,{
model:"gpt-image-2",
quality:"low",
...(ytImageData?{input_image:ytImageData}:{})
});
img.style.maxWidth="100%";img.style.borderRadius="18px";
$("ytResult").appendChild(img);
const a=document.createElement("a");
a.className="download";a.textContent="⬇️ Download 1280x720 HD";a.href=img.src;a.download="youtube-thumbnail-pro.png";a.target="_blank";
$("ytResult").appendChild(a);
$("ytStatus").textContent="✅ Ready! Ab YouTube pe daal do";
}catch(e){
$("ytStatus").textContent="Failed - Photo chhoti karo ya Puter me Sign in karke try karo";
}
}
$("ytBtn").onclick=genYT;

// Simple Generator
$("generate").onclick=async()=>{
let p=$("prompt").value.trim();if(!p)return;
$("genStatus").textContent="Generating...";
try{
const img=await puter.ai.txt2img(p,{model:"gpt-image-2",quality:"low"});
$("genResult").innerHTML="";$("genResult").appendChild(img);
$("genStatus").textContent="";
}catch(e){$("genStatus").textContent="Failed";}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Thumbnail Generator PRO</title>
<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:#080F1F;color:#fff}
.wrap{max-width:680px;margin:0 auto;min-height:100vh;background:radial-gradient(circle at 50% -10%,#14396F 0,#080F1F 55%)}
header{height:64px;display:flex;align-items:center;padding:0 20px;font-weight:800;font-size:21px;letter-spacing:-.3px;border-bottom:1px solid #ffffff0f}
header span{color:#5EA8FF}
.hero{padding:36px 22px 18px;text-align:center}
.hero h1{font-size:42px;letter-spacing:-1.5px;margin:0;line-height:1.05;font-weight:800}
.hero h1 b{color:#FF0F0F}
.hero p{color:#8EA3BB;font-size:15px;margin:10px auto 0;max-width:480px;line-height:1.5}
.card{margin:18px;background:#0E1C36;border:1px solid #ffffff14;border-radius:22px;padding:20px;box-shadow:0 30px 80px #0008}
.label{font-size:13px;color:#8EA3BB;font-weight:600;margin-bottom:8px;letter-spacing:.3px}
.upload{border:1.5px dashed #2A3E65;border-radius:16px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8AA0BB;background:#0A1830;cursor:pointer;transition:.2s;overflow:hidden;position:relative}
.upload:hover{border-color:#4A7BDB;background:#0E2043}
.upload input{display:none}
.upload.has-img{border-style:solid;padding:0}
.preview{width:100%;height:100%;object-fit:cover;border-radius:16px}
.textarea{width:100%;min-height:108px;background:#070F21;border:1px solid #1E325A;color:#EAF2FF;border-radius:14px;padding:14px;outline:none;font-size:14.5px;line-height:1.5;margin-top:18px}
.textarea:focus{border-color:#3B82F6}
.btn{width:100%;background:linear-gradient(180deg,#FF1A1A,#CC0000);border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;color:#fff;cursor:pointer;margin-top:16px;box-shadow:0 10px 24px #FF00004D}
.status{font-size:13px;color:#8EA5BF;text-align:center;margin-top:12px;min-height:16px}
.result{margin-top:18px}
.result img{width:100%;border-radius:16px;aspect-ratio:16/9;object-fit:cover;border:1px solid #ffffff15}
.download{display:block;margin-top:12px;background:#fff;color:#000;text-align:center;padding:13px;border-radius:12px;text-decoration:none;font-weight:800}
.hint{font-size:12px;color:#6B82A3;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header>Toolzy<span>AI</span> 🔴</header>

<div class="hero">
<h1>YouTube Thumbnail <b>PRO</b></h1>
<p>Apni photo dalo, prompt likho — AI same face ke saath viral thumbnail bana dega</p>
</div>

<div class="card">
<div class="label">1. UPLOAD YOUR PHOTO</div>
<label class="upload" id="drop">
<input id="file" type="file" accept="image/*">
<div id="ph">📸<br><b>Tap to upload photo</b><br><span style="font-size:12px">Face clear ho to best result aayega</span></div>
</label>

<div style="margin-top:20px" class="label">2. WRITE YOUR PROMPT</div>
<textarea id="prompt" class="textarea" placeholder="Example: Make this MrBeast style shocked face, money rain background, bright yellow, 8k, keep face same"></textarea>

<button id="gen" class="btn">Generate Viral Thumbnail 🚀</button>
<div id="status" class="status"></div>
<div id="result" class="result"></div>
<div class="hint">HD 1280x720 • No watermark • Face 100% same</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let imgData=null;
$("file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{imgData=r.result;$("drop").classList.add("has-img");$("drop").innerHTML=`<img class="preview" src="${imgData}"><input id="file" type="file" accept="image/*" style="display:none">`;}
 r.readAsDataURL(f);
};
$("gen").onclick=async()=>{
 let p=$("prompt").value.trim();
 if(!p){$("status").textContent="Pehle prompt likho";return;}
 let final=`YouTube thumbnail 1280x720 16:9 ultra viral high CTR ${p} keep face identity 100% same as input photo if provided bright colors professional studio lighting 8k no text no watermark`;
 $("status").textContent="🔥 Generating... 8-12 sec lagega";
 $("result").innerHTML="";
 try{
  const img=await puter.ai.txt2img(final,{model:"gpt-image-2",quality:"low",...(imgData?{input_image:imgData}:{})});
  $("result").appendChild(img);
  const a=document.createElement("a");a.className="download";a.textContent="⬇️ Download HD Thumbnail";a.href=img.src;a.download="yt-thumbnail-pro.png";a.target="_blank";
  $("result").appendChild(a);
  $("status").textContent="✅ Ready! Ab YouTube pe daal do";
 }catch(e){$("status").textContent="Ek baar puter.com pe Sign in karna padega, fir auto chalega";}
};
</script>
</body>
</html>

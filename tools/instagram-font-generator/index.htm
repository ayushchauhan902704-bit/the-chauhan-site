<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Font Generator Pro - 100+ Stylish Fonts | TheChauhanSite</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f0e] min-h-screen text-white">
<header class="flex justify-between items-center px-4 py-3 border-b border-[#1a2a27] bg-[#0f1715]">
<a href="/" class="text-[20px] font-black">THE<span class="text-[#ff3b7f]">CHAUHAN</span>SITE</a>
<span class="bg-[#ff3b7f] text-white text-[10px] font-black px-3 py-1 rounded-full">100+ FONTS • PRO</span>
</header>
<div class="max-w-[900px] mx-auto p-4">
<div class="bg-[#131d1b] rounded-[20px] border border-[#1f332e] p-5">
<h1 class="font-black text-[26px]">✒️ Instagram Font Generator Pro</h1>
<p class="text-[12px] text-[#8aa8a0] mt-1">Apna naam likho — 100+ stylish fonts me convert hoga</p>
<div class="flex gap-2 mt-5">
<input id="inputText" placeholder="Ayush Chauhan" class="flex-1 bg-[#0b1210] border border-[#23433d] px-4 py-3.5 rounded-xl font-bold outline-none text-white">
<button id="genBtn" class="bg-[#ff3b7f] px-7 py-3.5 rounded-xl font-black">GENERATE</button>
</div>
<div id="count" class="text-[11px] text-[#ff3b7f] font-bold mt-3"></div>
<div id="fontList" class="grid gap-3 mt-4"></div>
</div>
</div>
<script>
function fancyMap(str, map){return str.split('').map(c=>map[c.toLowerCase()]||map[c]||c).join('');}
const styleMaps=[
 {name:'Cursive', map:{'a':'𝒶','b':'𝒷','c':'𝒸','d':'𝒹','e':'𝑒','f':'𝒻','g':'𝑔','h':'𝒽','i':'𝒾','j':'𝒿','k':'𝓀','l':'𝓁','m':'𝓂','n':'𝓃','o':'𝑜','p':'𝓅','q':'𝓆','r':'𝓇','s':'𝓈','t':'𝓉','u':'𝓊','v':'𝓋','w':'𝓌','x':'𝓍','y':'𝓎','z':'𝓏'}},
 {name:'Double Struck', map:{'a':'𝕒','b':'𝕓','c':'𝕔','d':'𝕕','e':'𝕖','f':'𝕗','g':'𝕘','h':'𝕙','i':'𝕚','j':'𝕛','k':'𝕜','l':'𝕝','m':'𝕞','n':'𝕟','o':'𝕠','p':'𝕡','q':'𝕢','r':'𝕣','s':'𝕤','t':'𝕥','u':'𝕦','v':'𝕧','w':'𝕨','x':'𝕩','y':'𝕪','z':'𝕫'}},
 {name:'Fraktur', map:{'a':'𝔞','b':'𝔟','c':'𝔠','d':'𝔡','e':'𝔢','f':'𝔣','g':'𝔤','h':'𝔥','i':'𝔦','j':'𝔧','k':'𝔨','l':'𝔩','m':'𝔪','n':'𝔫','o':'𝔬','p':'𝔭','q':'𝔮','r':'𝔯','s':'𝔰','t':'𝔱','u':'𝔲','v':'𝔳','w':'𝔴','x':'𝔵','y':'𝔶','z':'𝔷'}},
 {name:'Bold Fraktur', map:{'a':'𝖆','b':'𝖇','c':'𝖈','d':'𝖉','e':'𝖊','f':'𝖋','g':'𝖌','h':'𝖍','i':'𝖎','j':'𝖏','k':'𝖐','l':'𝖑','m':'𝖒','n':'𝖓','o':'𝖔','p':'𝖕','q':'𝖖','r':'𝖗','s':'𝖘','t':'𝖙','u':'𝖚','v':'𝖛','w':'𝖜','x':'𝖝','y':'𝖞','z':'𝖟'}},
 {name:'Monospace', map:{'a':'𝚊','b':'𝚋','c':'𝚌','d':'𝚍','e':'𝚎','f':'𝚏','g':'𝚐','h':'𝚑','i':'𝚒','j':'𝚓','k':'𝚔','l':'𝚕','m':'𝚖','n':'𝚗','o':'𝚘','p':'𝚙','q':'𝚚','r':'𝚛','s':'𝚜','t':'𝚝','u':'𝚞','v':'𝚟','w':'𝚠','x':'𝚡','y':'𝚢','z':'𝚣'}},
 {name:'Circled', map:{'a':'ⓐ','b':'ⓑ','c':'ⓒ','d':'ⓓ','e':'ⓔ','f':'ⓕ','g':'ⓖ','h':'ⓗ','i':'ⓘ','j':'ⓙ','k':'ⓚ','l':'ⓛ','m':'ⓜ','n':'ⓝ','o':'ⓞ','p':'ⓟ','q':'ⓠ','r':'ⓡ','s':'ⓢ','t':'ⓣ','u':'ⓤ','v':'ⓥ','w':'ⓦ','x':'ⓧ','y':'ⓨ','z':'ⓩ'}},
];
function generate(){
 let txt=document.getElementById('inputText').value.trim()||'Ayush Chauhan';
 let list=document.getElementById('fontList'); list.innerHTML='';
 const extras=[t=>'꧁'+t+'꧂',t=>'༺'+t+'༻',t=>'★彡 '+t+' 彡★',t=>'♛ '+t+' ♛',t=>'🔥 '+t+' 🔥',t=>'☬ '+t+' ☬',t=>'『'+t+'』'];
 styleMaps.forEach(st=>{
   let converted=fancyMap(txt, st.map);
   extras.forEach(fn=>{ addCard(st.name, fn(converted)); });
 });
 document.getElementById('count').textContent=`✅ ${list.children.length}+ fonts — Instagram pe paste karo!`;
}
function addCard(label, text){
 let div=document.createElement('div');
 div.className='flex justify-between items-center bg-[#0b1210] border border-[#1e332e] rounded-xl px-4 py-3';
 div.innerHTML=`<div class="flex-1"><div class="text-[10px] text-[#5a7a75] font-bold uppercase">${label}</div><div class="text-[15px] font-bold mt-1">${text}</div></div><button class="ml-3 bg-[#ff3b7f] text-white px-4 py-2 rounded-full text-[11px] font-black">COPY</button>`;
 let btn=div.querySelector('button');
 btn.onclick=()=>{navigator.clipboard.writeText(text); btn.textContent='COPIED!'; setTimeout(()=>btn.textContent='COPY',1000);};
 document.getElementById('fontList').appendChild(div);
}
document.getElementById('genBtn').onclick=generate;
document.getElementById('inputText').addEventListener('input', generate);
generate();
</script>
</body>
</html>
